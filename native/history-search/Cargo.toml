[package]
name = "copilot-history-search"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.10.5", features = ["tokio_rt"] }
napi-derive = "3.4.2"
tantivy = "0.26.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.2.4"

[profile.release]
lto = "thin"
strip = "symbols"
