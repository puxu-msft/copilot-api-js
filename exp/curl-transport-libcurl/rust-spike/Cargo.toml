[package]
name = "copilot-http-transport-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
curl = { version = "0.4.50", features = ["http2"] }
napi = { version = "3.10.5", features = ["tokio_rt"] }
napi-derive = "3.4.2"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.2.4"
