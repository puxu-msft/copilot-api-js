[package]
name = "napi-http-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-util = "0.3.31"
napi = { version = "3.10.5", features = ["tokio_rt"] }
napi-derive = "3.4.2"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls", "stream"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.17"

[build-dependencies]
napi-build = "2.2.4"

[profile.release]
lto = "thin"
strip = "symbols"
