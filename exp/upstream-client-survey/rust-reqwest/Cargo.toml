[package]
name = "upstream-client-reqwest-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
http-body-util = "0.1"
napi = { version = "3.12.0", features = ["tokio_rt"] }
napi-derive = "3.6.2"
reqwest = { version = "0.13.4", default-features = false, features = ["http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[build-dependencies]
napi-build = "2.4.0"
