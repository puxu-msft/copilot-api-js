[install]
registry = { url = "https://registry.npmjs.org", token = "$NPM_TOKEN" }

[publish]
registry = "https://registry.npmjs.org"
token = "$NPM_TOKEN"

[test]
root = "./tests"
# Redirect APP_DIR-derived persistence to a temp dir so no test touches the real
# ~/.local/share/copilot-api (see tests/helpers/sandbox-paths.ts), then install
# the token + telemetry domains' ambient ports so their free functions resolve
# their transport / config in every test (see tests/helpers/install-token-deps.ts
# and install-telemetry-deps.ts; both ordered AFTER sandbox-paths so PATHS
# resolves against the redirected XDG_DATA_HOME).
preload = ["./tests/helpers/sandbox-paths.ts", "./tests/helpers/install-token-deps.ts", "./tests/helpers/install-telemetry-deps.ts"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
