# Copilot API Configuration / Copilot API 配置
# Copy this file to ~/.local/share/copilot-api/config.yaml and customize as needed.
# 把本文件复制到 ~/.local/share/copilot-api/config.yaml 后按需修改。
# All settings are hot-reloadable unless noted otherwise.
# 除非另有说明，所有设置均支持热重载。

# ============================================================================
# Proxy / 代理
# ============================================================================
# Proxy URL for all outgoing requests to GitHub / Copilot APIs. Supports http://, https://, socks5://, socks5h://.
# 所有发往 GitHub / Copilot API 的出站请求所用的代理 URL，支持 http://、https://、socks5://、socks5h://。
# socks5h:// routes DNS through the proxy (recommended for privacy). Auth via URL: socks5h://user:pass@host:port
# socks5h:// 会把 DNS 解析也走代理（更利于隐私）。认证写在 URL 里：socks5h://user:pass@host:port
# Lowest priority: HTTP_PROXY/HTTPS_PROXY env vars (when --http-proxy-from-env is on) and the CLI --proxy flag both take precedence over this setting. Priority: CLI --proxy > env vars > this.
# 优先级最低：HTTP_PROXY/HTTPS_PROXY 环境变量（在 --http-proxy-from-env 开启时）与 CLI 的 --proxy 参数都优先于本设置。优先级：CLI --proxy > 环境变量 > 本设置。
# NOT hot-reloadable (requires restart). / 不支持热重载（需重启）。

# proxy: "http://127.0.0.1:7890"
# proxy: "socks5h://127.0.0.1:1080"
# proxy: "socks5h://user:pass@proxy.example.com:1080"

# ============================================================================
# Model / 模型
# ============================================================================
# Model name overrides: request model → target model.
# 模型名映射：请求模型 → 目标模型。
# This is the SOLE source of model-name mapping — there are no built-in defaults.
# 这是模型名映射的唯一来源——没有任何内置默认值。
# Short aliases (opus/sonnet/haiku) resolve ONLY if you map them here; an unmapped alias is sent upstream as-is and rejected.
# 短别名（opus/sonnet/haiku）只有在这里映射后才会解析；未映射的别名原样发往上游并被拒绝。
#
# Override values can be full names ("claude-opus-4.6") or short aliases that are themselves mapped here.
# 映射的目标值可以是全名（"claude-opus-4.6"），也可以是同样在这里被映射的短别名。
# Keys/values are spelling-insensitive: "4.6" and "4-6" (and case) match the same model; listing both keys → the later wins (with a warning).
# 键/值对拼写不敏感："4.6" 与 "4-6"（及大小写）匹配同一模型；同时列出两个键则后者胜出（并发出警告）。
#
# Matching order: / 匹配顺序：
#   1. Whole name (e.g. "opus", "opus-1m", "claude-opus-4.6").
#      整名匹配（如 "opus"、"opus-1m"、"claude-opus-4.6"）。
#   2. Modifier suffix: "opus[1m]" → "opus-1m"; if no "opus-1m" mapping exists but "opus" is mapped, the base is redirected and "-1m" is re-attached.
#      修饰后缀："opus[1m]" → "opus-1m"；若无 "opus-1m" 映射但 "opus" 已映射，则基名被重定向后再拼回 "-1m"。
#   3. Hyphen/dot + date-suffix normalization, then a final override check.
#      连字符/点号 + 日期后缀归一化，再做一次最终的 override 检查。
#
# Only the exact keys listed are affected — NO family-level propagation. To redirect a whole family, list each canonical name.
# 仅列出的精确键受影响——不做 family 级传播。要重定向整个 family，请逐个列出其规范名。
# If a target isn't in the available models list it's treated as an alias and resolved again; if still unavailable it's passed through (the upstream then rejects it).
# 若目标不在可用模型列表中，则当作别名再次解析；仍不可用就直接透传（上游随后拒绝它）。

model_overrides:

  # Use latest opus / 使用最新 opus
  opus: claude-opus-4.8
  opus-1m: claude-opus-4.8
  claude-opus-4.5: claude-opus-4.8
  claude-opus-4.6: claude-opus-4.8
  claude-opus-4.7: claude-opus-4.8

  # Use latest sonnet / 使用最新 sonnet
  sonnet: claude-sonnet-4.6
  claude-sonnet-4.5: claude-sonnet-4.6

  # Redirect all sonnet requests to best opus / 把所有 sonnet 请求重定向到最好的 opus
  # sonnet: claude-opus-4.6
  # claude-sonnet-4.5: claude-opus-4.6
  # claude-sonnet-4.6: claude-opus-4.6

  # Upgrade haiku to sonnet / 把 haiku 升级到 sonnet
  # haiku: claude-haiku-4.5
  haiku: claude-sonnet-4.6
  claude-haiku-4.5: claude-sonnet-4.6

