# ============================================================================
# Lifecycle (Shutdown + Timeout + Retry) / 生命周期（关闭+超时+重试）
# ============================================================================

# 优雅退出分为以下阶段：
#   1. 收到关闭信号，停止接收新请求（立即）。
#   2. 等待在飞请求自然完成（默认 60s）。
#   3. 中止在飞请求，等待内部处理收尾（默认 120s）。
#   4. 强制退出（立即）。
#
# Graceful shutdown by following phases:
#   1. Stop accepting new requests (immediate) on shutdown signal.
#   2. Wait for in-flight requests to complete naturally (default 60s).
#   3. Abort in-flight requests; wait for internal handlers to wrap up (default 120s).
#   4. Force exit (immediate).
#
shutdown:
  # 阶段 2 / Phase 2
  graceful_wait: 300
  # 阶段 3 / Phase 3
  abort_wait: 120

timeouts:
  # 单次尝试上游，从请求发起到开始收到 HTTP 响应头的最大秒数（0 = 不超时）。
  # Each upstream attempt: Max seconds from request start to receiving HTTP response headers (0 = no timeout).
  response_header: 600

  # 按模型覆盖 response_header（秒），键规则同 stream_idle_overrides。无内置值。
  # Per-model response_header override (seconds), same keying as stream_idle_overrides. No built-in value.
  response_header_overrides: {}

  # 单次尝试上游，SSE 事件之间的最大间隔秒数（0 = 不超时）。适用于所有流式路径。
  # Each upstream attempt: Max seconds between SSE events (0 = no timeout). Applies to all streaming paths.
  stream_idle: 600

  # 按模型覆盖 stream_idle（秒），键为模型名子串；"*" = 所有模型。
  # Per-model stream_idle override (seconds), keyed by model-name substring; "*" = all models.
  #
  # 命中项优先于上面的标量 stream_idle；0 = 禁用（无空闲超时）。最长子串匹配胜出。
  # A match wins over the scalar stream_idle above; 0 = disabled (no idle timeout). Longest-substring match wins.
  #
  # 引入理由：观察到 gpt-5.5 (effort=high) 爆发前有 266–462s 的零帧静默期，但一些早期模型不会。
  # Reason: Observed gpt-5.5 (effort=high) emits a single 266–462s zero-frame silent-reasoning gap before a burst, but some earlier models do not.
  stream_idle_overrides:
    gpt-5.5: 600

  # 单次尝试上游，最大存活秒数（0 = 禁用）。
  # Max seconds an active upstream request can live (0 = disabled).
  #
  # TODO: rename stale_request_max_age as upstream_request_deadline
  stale_request_max_age: 1200

  # 客户端请求的最大存活秒数（0 = 禁用）。一次客户端请求可能会被多次内部重试。
  # Max seconds an active client request can live (0 = disabled). One client request may be attempted multiple times.
  #
  # TODO: rename request_deadline as client_request_deadline
  request_deadline: 1200

# ============================================================================
# Upstream transport (GHC) / 上游传输
# ============================================================================
# 面向 GHC 上游的出站连接行为，按协议组织；区别于 timeouts.*（协议无关的请求生命周期看门狗）。
# Outbound connection behavior toward the GHC upstream, organized by protocol; distinct from timeouts.* (protocol-agnostic request-lifecycle watchdogs).

upstream_transport:
  # *实验性* 上游 TCP keepalive 首探针延迟秒数（0 = 禁用探针；键不写 = 默认 15）。
  # *Experimental* Upstream TCP keepalive initial-probe delay in seconds (0 = disable probing; key absent = default 15).
  #
  # 观察到长时间的静默期（无上/下行流量），上行连接被 NAT/防火墙的空闲回收掐断（"terminated (cause: other side closed)"）。故引入 L4 探针维持不被回收。
  # Observed long silent periods (no send/recv traffic) where NAT/firewall idle reapers sever the upstream connection; the L4 probe keeps it alive.
  #
  # Bun 与 Node 均生效——h2 socket 路径（node:tls）与运行时无关。
  # Effective on BOTH Bun and Node — the h2 socket path (node:tls) is runtime-neutral.
  tcp_keepalive_probe_delay: 15
  http2:
    # *实验性* 上游 HTTP/2 PING 保活间隔秒数（0 = 禁用）。
    # *Experimental* Upstream HTTP/2 PING keepalive interval in seconds (0 = disabled).
    #
    # tcp_keepalive_probe_delay 的应用层补充：经网络代理时 TCP keepalive 只覆盖 this <-> proxy，到不了上游；H2 PING 帧仍能透过代理把真实帧发往上游。GHC 的 CAPI 代理不透传 Anthropic 的 SSE `event: ping`，故长思考静默期是一条真正空闲的流。
    # Application-layer complement to tcp_keepalive_probe_delay: with a network proxy the TCP keepalive only covers this <-> proxy, not the upstream; an H2 PING still puts a real frame on the wire through the proxy. GHC's CAPI proxy does NOT forward Anthropic's SSE `event: ping`, so a long thinking silence is a truly idle stream.
    #
    # Bun 与 Node 均生效（node:http2 传输与运行时无关）。
    # Works on both Bun and Node (node:http2 transport is runtime-neutral).
    ping_interval: 15
    # 单次 h2 会话建立尝试的 TCP 连接 + TLS 握手期限（秒，0 = 无超时）。
    # TCP connect + TLS handshake deadline (seconds) for a single h2 session establishment attempt (0 = no timeout).
    #
    # 单次尝试的连接上限，非总请求期限——见 ADR D3。配 SOCKS 代理时 0 被拒绝（socks 库地板 30s，无法真禁用，宁可报错也不冒充禁用）。
    # Per-attempt connect ceiling, NOT a total request deadline — see ADR D3. Rejected as 0 when a SOCKS proxy is set (the socks library floors at 30s and cannot truly disable it — fail-fast rather than fake a disable).
    session_connect_timeout: 10
  websocket:
    # 池中空闲（未使用）上游 Responses WS 连接被主动关闭前的空闲超时秒数（0 = 永不空闲关闭）。
    # Idle timeout in seconds for a pooled (not-in-use) upstream Responses WS connection before it is proactively closed (0 = never idle-close).
    pooled_connection_idle_timeout: 300
    # 上游 WS 池大小软上限（0 = 无限）。软 = 全忙时允许溢出，之后逐个空闲驱逐回落。
    # Soft cap on upstream WS pool size (0 = unlimited). Soft = overflow allowed when all busy, then evicted back down as connections go idle.
    soft_max_connections: 32


# 反应式速率限制仅在上游返回 HTTP 429 / 502 时触发；不影响上游返回 503/504 的重试行为。不支持热重载（需重启）。
# Reactive rate limiting is only triggered on upstream HTTP 429 / 502; does not affect upstream 503/504 retry behavior. Not hot-reloadable (requires restart).
rate_limiter:
  # 速率限制错误后重试前的等待秒数
  # Seconds to wait before retrying after rate limit error
  retry_interval: 10
  # 受限模式下请求之间的间隔秒数
  # Seconds between requests in rate-limited mode
  request_interval: 10
  # 受限模式下尝试恢复前的等待秒数
  # Seconds before attempting recovery from rate-limited mode
  recovery_interval: 600
  # Consecutive successes needed to exit rate-limited mode
  # 退出受限模式所需的连续成功次数
  consecutive_successes: 5

# ============================================================================
# Buffered-retry caps (vendor-neutral SHARED) + per-vendor overrides
# 缓冲重试上限（vendor 中立共享）+ 各 vendor 覆盖
# ============================================================================
# max_retries / buffer_cap_bytes / heartbeat_sec three caps are SHARED across all
# vendors (anthropic / responses / chat_completions), overridden per-vendor via
# <vendor>.buffered_retry.*. Resolution priority: per-vendor override > shared
# buffered_retry.* > built-in default (3 / 16777216 / 15).
# 三项 caps 对所有 vendor 共享，可被 <vendor>.buffered_retry.* 覆盖。优先级：per-vendor 覆盖 > 共享 > 内置默认。
# Legacy anthropic.protect_streaming_{max_retries,heartbeat,buffer_cap_bytes} migrate
# here automatically (warn-once on the old key). / 旧键自动迁移到此（读旧键 warn 一次）。

buffered_retry:
  # Max transport-close / truncation retries (loop/cost guard, NOT a timeout guard — the client is kept alive by the forced heartbeat below). 0 = no retry.
  # transport-close/truncation 最大重试次数（loop/成本闸，非超时闸——客户端由下方强制心跳保活）。0 = 不重试。
  max_retries: 3
  # Buffered-path memory guard: max bytes to buffer before ABANDONING buffering and retreating to live forwarding for the rest of THIS response (which then loses L2 protection). Prevents a pathologically huge generation from buffering unbounded → OOM. 0 = unlimited. Default 16MiB.
  # 缓冲路径内存守卫：累计缓冲超此字节即放弃缓冲、本响应剩余部分退回实时转发（随之失去 L2 保护）。防止病态超大生成无界缓冲导致 OOM。0 = 无限制。默认 16MiB。
  buffer_cap_bytes: 16777216
  # Forced heartbeat interval (seconds) for the buffered path: the buffer withholds all real frames until commit, so a heartbeat is constructed UNCONDITIONALLY — using stream_keepalive_ping_sec when >0, else this fallback.
  # 缓冲路径的强制心跳间隔秒数：缓冲期在提交前不发任何真实帧，故无条件构造心跳——stream_keepalive_ping_sec >0 时取其值，否则用本值兜底。
  heartbeat_sec: 15
  # Continuation retry (spec 2026-07-22): after the FIRST block committed to the client, a mid-stream RST (e.g. NGHTTP2_CANCEL cutting a tool_use) no longer degrades to partial-degrade — the proxy re-dispatches upstream with a synthetic continuation turn (the already-committed blocks as an assistant turn + this user message) so the model continues rather than restarts. Shares max_retries above (with a floor of 1 so pre-first-block retries can't starve continuation). Valid per-vendor too (<vendor>.buffered_retry.continuation.*).
  # 续写重试（spec 2026-07-22）：首个块提交给客户端后，mid-stream RST（如 NGHTTP2_CANCEL 掐断 tool_use）不再降级 partial-degrade——代理带合成续写轮（已提交块作 assistant 轮 + 下方 user 消息）重投上游，让模型续写而非重来。共享上方 max_retries（保底 1 次，防首块前重试饿死续写）。可 per-vendor 覆盖（<vendor>.buffered_retry.continuation.*）。
  continuation:
    enabled: true
    message: "network issue. please continue"

# Per-vendor overrides + enabled mode switch (examples, commented out by default):
# 各 vendor 覆盖 + enabled 开关（示例，默认注释）：
#   anthropic.buffered_retry — caps override only; Anthropic's switch is anthropic.protect_streaming_generation (default false; enabled ignored here). Block-level delivery CLI-safety comes from strict index-ordered output; the empty-text anchor keepalive was retired (ADR 2026-07-22 D2).
#   anthropic.buffered_retry — 仅覆盖 caps；Anthropic 的开关是 protect_streaming_generation（默认 false；此处 enabled 被忽略）。块级递送的 CLI-safety 靠严格按 index 顺序输出；空-text 锚点保活已退役（ADR 2026-07-22 D2）。
#   openai_responses.buffered_retry / chat_completions.buffered_retry — boolean shorthand = enabled, or map { enabled, max_retries, buffer_cap_bytes, heartbeat_sec }. Both DEFAULT TRUE (2026-07-14 flip; covers Responses-HTTP + Responses-WS, which has no independent switch and inherits openai_responses.buffered_retry) — buffering/generation-preservation was chosen over the downstream streaming UX. Set to `false` explicitly to opt back into live (unbuffered) forwarding.
#   openai_responses.buffered_retry / chat_completions.buffered_retry — bool 简写 = enabled，或 map { enabled, ...caps }。两者默认皆为 true（2026-07-14 翻转；覆盖 Responses-HTTP + Responses-WS——WS 无独立开关，继承 openai_responses.buffered_retry）——缓冲/生成保全被选中优先于下游流式体验。显式设 `false` 可退回实时（非缓冲）转发。
# anthropic:
#   buffered_retry:
#     max_retries: 5
# openai_responses:
#   buffered_retry: false           # opt back into live (unbuffered) forwarding; default is true. or: { enabled: false }
# chat_completions:
#   buffered_retry: false           # opt back into live (unbuffered) forwarding; default is true. or: { enabled: true, max_retries: 4 }

# ============================================================================
# History & Telemetry / 历史记录与遥测
# ============================================================================

history:
  # 是否启用历史记录。CLI --no-history 优先。不支持热重载。
  # Enable history recording. CLI --no-history takes precedence. Not hot-reloadable.
  enabled: false
  db_path: "history.db"

  # 保留的最新成功/失败请求数（-1 = 无限制，0 = 临时禁止）。
  # Successful/Failed entries kept in SQLite (-1 = unlimited, 0 = temporarily disabled).
  success_limit: 1000
  failure_limit: 1000

  # Seconds between reaper passes that trim each bucket (0 = disabled, default: 600)
  # 修剪各桶的周期间隔秒数（0 = 禁用，默认 3600）
  reaper_interval: 3600

  # 捕捉原始客户端/上游字节流到独立数据库。需启用历史记录。
  # Exact-byte capture in an independent database. History must be enabled.
  raw_capture:
    enabled: false
    db_path: "raw.db"
    max_object_bytes: 16777216

  # 终态落盘遇瞬时 SQLite 失败（WAL BUSY/LOCKED/IOERR）时的有界重试（DI-5）。
  # 此前首次失败即丢弃该 entry；现改为线性退避重试，permanent/conflict 不重试。
  # Bounded retry for terminal-persistence commits that hit a transient SQLite
  # error. Permanent failures / conflicts are never retried.
  persist_retry:
    max_attempts: 3
    backoff_ms: 10

# 遥测分三层滚筒（5min/1h/1d）+ 终身累计。
# Telemetry has three-tier rollup (5min / hourly / daily) + lifetime cumulative.
telemetry:
  # 是否启用遥测。CLI --no-telemetry 优先。不支持热重载。
  # Enable telemetry. CLI --no-telemetry takes precedence. Not hot-reloadable.
  enabled: false
  db_path: "telemetry.db"

  # raw 落盘/flush 间隔秒（默认 60）。 / raw persist/flush interval seconds (default 60).
  persist_interval: 60
  # rollup 上卷间隔秒（默认 3600，独立于 persist、应 ≫ persist）。 / rollup interval seconds (default 3600).
  rollup_interval: 3600
  # capped 维度（client/tool）key 上限，溢出并入 "other"（默认 200）。 / capped-dimension key cap (default 200).
  cardinality_cap: 200
  # DDSketch 相对误差 γ（默认 0.01=1%）。下限 ~0.005——配更紧会触发 bin 塌缩、警告回落 0.01。
  # DDSketch relative accuracy (default 0.01). Lower bound ~0.005; tighter warns + falls back.
  sketch_gamma: 0.01
  # 终身累计层开关（永久有效，默认 true）。 / lifetime cumulative layer (default true).
  cumulative: true
  # 分层保留 / tiered retention
  tiers:
    raw:
      # 近期桶分辨率（分钟，默认 5；须整除 60，否则警告回落 5）。 / near-term bucket resolution minutes.
      resolution_minutes: 5
      # 近期高分辨率保留天数（默认 7）。 / near-term retention days (default 7).
      retention_days: 7
    hourly:
      # 中期 rollup 保留天数（默认 90）。 / mid-term retention days (default 90).
      retention_days: 90
    daily:
      # 远期保留天数（0 = 永久，默认 0）。 / far-term retention days (0 = forever, default 0).
      retention_days: 0

# ============================================================================
# Anthropic Format and Features / Anthropic 格式与功能
# ============================================================================

anthropic:
  # Model-capability allowlists — which models get each Anthropic capability.
  # 模型能力名单——哪些模型获得各项 Anthropic 能力。
  # Each list holds model-name "family" prefixes (normalized: lowercase, dots→dashes).
  # 每个列表存模型名的 "family" 前缀（归一化：小写、点号→连字符）。
  # A model has the capability when its normalized id EQUALS an entry or starts with `entry + "-"` — so `claude-opus-4` matches `claude-opus-4` and the whole `claude-opus-4-x` family, but NOT the unrelated `claude-opus-40`.
  # 模型具该能力当且仅当其归一化 id 等于某项或以 `项 + "-"` 开头——故 `claude-opus-4` 匹配 `claude-opus-4` 及整个 `claude-opus-4-x` 族，但不匹配无关的 `claude-opus-40`。
  # These mirror GitHub Copilot Chat's capability checks; edit to add/remove models (e.g. a new Claude release) WITHOUT a code change. Entries may be dotted or dashed.
  # 这些镜像 GitHub Copilot Chat 的能力判定；增删模型（如新 Claude 版本）只改这里、无需改码。项可写点号或连字符形态。
  model_capabilities:
    # context_management (clear_tool_uses / clear_thinking) support. / context_management（clear_tool_uses / clear_thinking）支持。
    context_editing:
      - claude-haiku-4-5
      - claude-sonnet-4
      - claude-opus-4
      - claude-opus-41
    # interleaved-thinking-2025-05-14 beta (non-adaptive thinking models). / interleaved-thinking-2025-05-14 beta（非 adaptive thinking 模型）。
    interleaved_thinking:
      - claude-sonnet-4
      - claude-haiku-4-5
      - claude-opus-4-5
    # Adaptive thinking ({type:adaptive}) — name fallback when /models metadata is silent. / Adaptive thinking（{type:adaptive}）——/models 元数据缺失时按名单兜底。
    adaptive_thinking:
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8
    # extended-cache-ttl-2025-04-11 support (1h prompt cache). Mirrors GHC — NARROWER than context/memory
    # (no bare sonnet-4 / opus-4 / opus-4.1). / extended-cache-ttl-2025-04-11 支持（1h prompt cache）。镜像 GHC，比 context/memory 更窄。
    extended_cache_ttl:
      - claude-fable-5
      - claude-opus-4-5
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8
      - claude-sonnet-4-5
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-haiku-4-5
    # Native memory tool (memory_20250818) support. Mirrors GHC modelSupportsMemory — BROADER than
    # extended-cache-ttl. The bare `claude-sonnet-4` / `claude-opus-4` entries are load-bearing (cover all
    # sonnet-4.x / opus-4.x); the specific entries below are redundant but self-documenting — do NOT drop
    # the bare ones. / 原生 memory 工具（memory_20250818）支持。镜像 GHC，比 extended-cache-ttl 更宽。裸 `claude-sonnet-4`
    # / `claude-opus-4` 是载荷项（覆盖所有 sonnet-4.x / opus-4.x），下面的具体项冗余但自文档——别删裸项。
    memory:
      - claude-fable-5
      - claude-haiku-4-5
      - claude-sonnet-4
      - claude-sonnet-4-5
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-opus-4
      - claude-opus-4-1
      - claude-opus-4-5
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8

    # Native server-side tool_search is DEFAULT-ALLOW for Claude ≥4.5 (Haiku + pre-4.5 denied), mirroring
    # GHC — new Claude models are picked up automatically, no list to maintain. This map holds per-model
    # OVERRIDES only: keys are model-name substrings ("*" = wildcard), value true=force-on / false=force-off.
    # Precedence: declared /models metadata > this override map (most-specific key wins) > default-allow.
    # Gated overall by the `tool_search` master switch below. Default: none (default-allow decides).
    # 原生服务端 tool_search 对 Claude ≥4.5 默认放行（拒 Haiku 与 pre-4.5），镜像 GHC——新模型自动点亮、无名单维护。
    # 此表只放 per-model 覆盖：键是模型名子串（"*"=通配），值 true=强制开 / false=强制关。
    # 优先级：/models 元数据 > 本覆盖表（最具体键胜）> default-allow。总闸是下方 `tool_search` 开关。默认：空（由 default-allow 决定）。
    # tool_search_overrides:
    #   claude-opus-4-8: true
    #   "*": false

  # Client→upstream request-header forwarding MODE (Anthropic path). Selects which list below is active. Both modes apply the same security floor first: the proxy's own core keys (Authorization / editor-version / x-request-id / openai-intent / x-github-api-version / anthropic-version / anthropic-beta / …) always win, and a sensitive denylist (cookie / x-api-key / host / content-length / content-encoding / accept-encoding / forwarded chain / hop-by-hop + x-github-* / openai-* namespaces) is ALWAYS removed — the whitelist cannot re-admit a credential. Request-side mirror of strict_response_headers.
  #   false (default) = BLACKLIST mode: forward client headers EXCEPT request_header_blacklist globs.
  #   true            = WHITELIST mode: forward ONLY client headers matching request_header_whitelist globs (plus the rebuilt core).
  # 客户端→上游请求头转发模式（Anthropic 路径）。决定下面哪个名单生效。两模式都先过同一安全地板：代理自有 core 键永远优先、敏感黑名单（cookie / x-api-key / host / content-length / content-encoding / accept-encoding / forwarded 链 / hop-by-hop + x-github-* / openai- 命名空间）永远剥除——whitelist 不能重新放行凭据。是 strict_response_headers 的请求侧镜像。
  #   false（默认）= BLACKLIST 模式：转发客户端头，但剥除 request_header_blacklist glob 命中者。
  #   true        = WHITELIST 模式：只转发 request_header_whitelist glob 命中的客户端头（外加重建的 core）。
  strict_request_headers: true

  # BLACKLIST-mode glob list (header name; * / ?): client headers stripped from the forwarded set (active when strict_request_headers is false). Acts on the security-floor subset ONLY (never the proxy's own core/anthropic-beta headers), so "*" just empties it (= core-only) and is harmless. Default strips the HTTP-header form of x-anthropic-billing-header. NOTE: that header is now DEFENSIVE — current Claude Code carries attribution in the request body (system[0]), handled by strip_attribution_header below; this HTTP-header entry only catches older clients / the header form.
  # retain-on-absence: the default applies on first load / PUT /api/config reset only; deleting this key KEEPS the running value; [] clears it. To restore the default, reset (PUT /api/config) rather than deleting the key.
  # BLACKLIST 模式 glob 列表（头名；* / ?）：从转发集里剥除的客户端头（strict_request_headers 为 false 时生效）。只作用于安全地板子集（绝不动代理自有 core/anthropic-beta 头），故 "*" 只是清空它（= 仅 core），无害。默认剥 x-anthropic-billing-header 的 HTTP 头形态。注：该头现为防御性——当前 Claude Code 把 attribution 放在请求体（system[0]）、由下面的 strip_attribution_header 接管；本 HTTP 头项只覆盖旧版客户端 / HTTP 头形态。
  # retain-on-absence：默认仅在首次加载 / PUT /api/config reset 时生效；删除此键会保留当前运行值；[] 清空。要恢复默认请用 reset（PUT /api/config），而非删键。
  request_header_blacklist:
    - x-anthropic-billing-header

  # WHITELIST-mode glob list (header name; * / ?): the ONLY client headers forwarded (active when strict_request_headers is true), beyond the proxy's rebuilt core. [] forwards nothing (core-only). NOTE: listing a true core header (e.g. user-agent) is a no-op — the security floor strips it and the proxy re-injects core regardless; only NON-core client headers are meaningfully whitelistable. Default = the safe Claude Code / SDK headers beyond core. retain-on-absence (same semantics as the blacklist).
  # WHITELIST 模式 glob 列表（头名；* / ?）：除代理重建 core 外、唯一被转发的客户端头（strict_request_headers 为 true 时生效）。[] 表示不转发任何客户端头（仅 core）。注：白名单里写真 core 头（如 user-agent）是 no-op——安全地板会剥掉它、core 由代理兜底重注入；只有非 core 客户端头才可被有效白名单放行。默认 = core 之外的安全 Claude Code / SDK 头。retain-on-absence（语义同 blacklist）。
  request_header_whitelist:
    - accept
    - anthropic-dangerous-direct-browser-access
    - x-app
    - x-claude-code-*
    - x-stainless-*

  # Strip the Claude Code attribution billing line carried as a `system` block in the request BODY. Current Claude Code no longer sends attribution as an HTTP header — it injects `x-anthropic-billing-header: cc_version=…; cc_entrypoint=…;` as the FIRST `system` text block (a header-shaped line inside the body), which the HTTP-header `strip_request_headers` above cannot reach. true (default) removes that leading billing line from the system param (string or system[0]); a block emptied by the strip is dropped. Position-anchored + whole-line match (only system[0]'s leading line), so the literal name appearing later in real prose is never touched. Anthropic path only; complements (does not replace) the HTTP-header strip. The source-side lever is the client's own CLAUDE_CODE_ATTRIBUTION_HEADER=0.
  # 剥离以请求体 `system` 块形式携带的 Claude Code attribution billing 行。当前 Claude Code 不再以 HTTP 头发送 attribution，而是把 `x-anthropic-billing-header: cc_version=…; cc_entrypoint=…;` 注入为**第一个** `system` 文本块（请求体内一行伪装成 header 的文本），上面那个针对 HTTP 头的 `strip_request_headers` 够不到它。true（默认）从 system 参数（string 或 system[0]）剥掉这个前导 billing 行；被剥空的块会被丢弃。位置锚定 + 整行匹配（只看 system[0] 的前导行），故正文里后出现的同名字面量绝不被误剥。仅 Anthropic 路径；与 HTTP 头剥离互补（而非替代）。源头杠杆是客户端自身的 CLAUDE_CODE_ATTRIBUTION_HEADER=0。
  strip_attribution_header: true

  # ---------------------------------------------------------------------------
  # anthropic-beta header pre-filter / anthropic-beta header 预过滤
  # ---------------------------------------------------------------------------
  # Strip the listed `anthropic-beta` tokens from outbound requests before they are forwarded upstream.
  # 转发上游前从出站请求剥离列出的 `anthropic-beta` token。
  # Keys are model-name substrings matched against the resolved model name; the pseudo-key "*" applies to every model.
  # 键是匹配解析后模型名的模型名子串；伪键 "*" 应用到所有模型。
  # Applies to both client-sent and locally-built betas, so use it for tokens the upstream rejects (e.g. `unsupported beta header(s): X`).
  # 同时作用于客户端发送与本地构建的 beta，故用于上游拒绝的 token（如 `unsupported beta header(s): X`）。
  #
  # Match semantics (strip-list — additive): every matching key contributes its tokens to the strip set, including "*". Use "*" to define a baseline and per-model keys to add to it.
  # 匹配语义（剥离表——叠加）：每个匹配键（含 "*"）都把其 token 并入剥离集。用 "*" 定基线、per-model 键追加。
  #
  # Runtime negotiation also populates a persistent cache (negotiation-states.json) when upstream returns "unsupported beta header(s)". Config entries are always applied; runtime-learned entries survive restarts.
  # 上游返回 "unsupported beta header(s)" 时运行时协商也会写入持久缓存（negotiation-states.json）。config 项始终生效；运行时学习项跨重启保留。
  #
  # Default: none (no pre-filter; rely on runtime negotiation only). / 默认：无（不预过滤；仅靠运行时协商）。
  beta_strip_headers:
    claude-opus-4.7-1m-internal:
      - context-1m-2025-08-07
      - mid-conversation-system-2026-04-07
    claude-sonnet-4.6:
      # Why these four for claude-sonnet-4.6: this account routes sonnet-4.6 to Vertex AI, which rejects them with a laconic 400 ("invalid beta flag").
      # 为何 claude-sonnet-4.6 剥这四个：本账号把 sonnet-4.6 路由到 Vertex AI，它用简短 400（"invalid beta flag"）拒绝这些。
      - interleaved-thinking-2025-05-14
      - context-management-2025-06-27
      - prompt-caching-scope-2026-01-05
      - mid-conversation-system-2026-04-07

  # Per-model supported effort levels (whitelist) for output_config.effort. / output_config.effort 的 per-model 支持档位（白名单）。
  # Keys are model name substrings matched against the resolved model name. / 键是与解析后模型名匹配的模型名子串。
  # Values are arrays of supported efforts from: none, low, medium, high, xhigh, max. / 值是支持档位数组，取自：none、low、medium、high、xhigh、max。
  # Requests outside the whitelist are clamped to the nearest supported value (above max → max supported; below min → min supported). / 白名单外的请求会被钳到最近支持值（高于上限→最高支持值；低于下限→最低支持值）。
  #
  # Match semantics (whitelist — single source of truth): / 匹配语义（白名单——单一真相源）：
  #   - The MOST SPECIFIC (longest) key whose substring matches the model wins. e.g. for model "claude-opus-4.7-high", the key "claude-opus-4.7-high" beats "claude-opus-4.7"; only the winning key's values apply (no union). / 最具体（最长）的匹配键胜出，如 "claude-opus-4.7-high" 击败 "claude-opus-4.7"；仅胜出键的值生效（不取并集）。
  #   - The pseudo-key "*" is a last-resort wildcard (used only when no other key matches). / 伪键 "*" 是最后兜底通配（仅无其它键匹配时用）。
  #
  # Cross-validation: if a configured whitelist contains efforts the upstream model metadata does NOT declare, the out-of-range entries are dropped with a warn log. If the intersection is empty, the metadata wins (avoids guaranteed 400s from stale config). / 交叉校验：若配置白名单含上游元数据未声明的档位，超范围项被丢弃并 warn；交集为空则元数据胜出（避免陈旧配置必 400）。
  #
  # Runtime dynamically extends this (learned from invalid_reasoning_effort errors, persisted to negotiation-states.json). Config-sourced entries take precedence over runtime-learned, which in turn take precedence over model metadata. / 运行时动态扩展（从 invalid_reasoning_effort 错误学习，持久化到 negotiation-states.json）。优先级：config > 运行时学习 > 模型元数据。
  # Default: no constraints (all effort levels declared by the model pass through). / 默认：无约束（模型声明的所有档位皆透传）。
  # effort_overrides:
  #   claude-opus-4.7: [medium]
  #   claude-opus-4.7-1m-internal: [medium]

  # 有的模型会拒绝 messages array 中包含 role:"system" 的消息，实测 GHC API claude-sonnet-4.6 / claude-haiku-4.5 报 `Unexpected role "system"` 400。但 OpenAI 习惯这么做，Claude Code 对话中途注入的上下文也会这么做。
  # "reject mode" "default mode" 分别指对于在/不在 "system_reject_models" 中的模型，在请求发出去前是否改写这些消息。
  #
  # 有如下选项：
  #   as_user:      rewrite role to "user" — keeps conversation position (recommended) / 改 role 为 "user"——保留对话位置（推荐）
  #   merge:        append their text to the top-level system, drop the messages (hurts prompt cache; loses position) / 提取文本追加到顶层 system 并删消息（损害 prompt cache；丢失位置）
  #   drop_invalid: remove them entirely (loses the context) / 直接删除（丢失上下文）
  #   as_assistant: rewrite role to "assistant" (experimental, NOT recommended — disguises context as model output) / 改 role 为 "assistant"（实验性、不推荐——把上下文伪装成模型输出）
  #   false:        passthrough unchanged (default) — correct for accepters like Opus; a not-yet-known rejecter's first request 400s, then reactive learning marks it (permanent, no TTL) + retries / 原样透传（默认）——对 Opus 这类接受者是对的；未知拒绝者首个请求会 400，随后反应式学习标记它（永久、无 TTL）并重试
  #
  # 有反应式学习机制，当透传但 400 后，会加入学习记录并重试

  # For inline role:"system" messages (mixed into the messages array) — the fallback applied to every model NOT in system_reject_models below. Rejecters in that set use the system_reject_mode override instead; the two keys share this same mode enum and differ only in which model bucket they apply to.
  # inline role:"system" 消息（混入 messages 数组）的**默认 mode**——作用于所有不在下方 system_reject_models 里的模型。命中 reject 集的模型改用 system_reject_mode 覆盖；两个键共用同一 mode 枚举，只差作用在哪桶模型。
  # Whether inline system needs handling at all is PER UPSTREAM BACKEND: STRICT backends (empirically claude-sonnet-4.6 / claude-haiku-4.5 on this account) 400 with `Unexpected role "system"`; others (e.g. Opus) accept it — hence the false default.
  # inline system 是否需要处理**取决于上游后端**：STRICT 后端；其它（如 Opus）接受——故默认 false。
  # Such inline system messages come from OpenAI-habit clients or Claude Code mid-conversation context injections (hook output / rules / reminders).
  # 这类 inline system 来自 OpenAI 习惯客户端或 Claude Code 对话中途注入的上下文（hook 输出 / 规则 / 提醒）。
  system_default_mode: false

  # 上游严格后端拒绝 inline role:"system" 的模型集（观测症状，非 vertex 硬断言）。子串匹配 resolved outbound 名（归一化）。
  # 命中 → 用 system_reject_mode；未命中 → 回退 system_default_mode。运行时还会从上游拒绝中学习扩展该集。
  # Models whose upstream STRICT backend rejects inline role:"system" (observed symptom, not a Vertex assertion).
  # Substring set matched against the resolved outbound model name. Matched → system_reject_mode; else → system_default_mode.
  # Default [claude-sonnet-4.6, claude-haiku-4.5] + as_user (empirically confirmed: these two reject inline system, Opus etc. accept). / 默认命中集 + as_user（实测确认：这两个拒绝 inline system，Opus 等接受）。
  # system_reject_models:
  #   - claude-sonnet-4.6
  #   - claude-haiku-4.5
  system_reject_mode: as_user

  # Dedup tool calls: false | "input" | "result" (true = "input" for compat)
  # 去重工具调用：false | "input" | "result"（true 兼容映射为 "input"）
  # "input": dedup by (name, input); "result": also require identical result
  # "input"：按 (name, input) 去重；"result"：还要求结果一致
  tool_dedup_calls: false

  # Master switch for tool-search (both the advanced-tool-use beta header AND the Copilot tool_search
  # helper injection). When true, tool-search is enabled for every model the capability resolver allows
  # (default-allow Claude ≥4.5, refined by model_capabilities.tool_search_overrides above). false = off
  # for all models. / tool-search 总闸（同时管 advanced-tool-use beta 头与 Copilot tool_search 工具注入）。
  # 为 true 时对能力解析放行的每个模型启用（default-allow Claude ≥4.5，由上方 tool_search_overrides 细调）；false = 全部关闭。
  tool_search: true

  # Anthropic memory tool (native memory_20250818 — a client-EXECUTED typed tool, NOT a server tool:
  # the model drives it, the client runs /memories). Default FALSE — CAPI acceptance of the typed
  # descriptor is UNVERIFIED (GHC only sends it on its direct-Anthropic BYOK path, not via CAPI).
  # When true AND the model supports memory (model_capabilities.memory above), a client tool named
  # `memory` is rewritten to {name:"memory", type:"memory_20250818"} and the context-management-2025-06-27
  # beta is forced (memory rides that beta upstream). The tool is executed client-side (Claude Code), so
  # there is no response-side handling. Off → the memory tool passes through as an ordinary custom tool.
  # Anthropic memory 工具（原生 memory_20250818——是客户端执行的 typed 工具，不是 server tool：模型驱动、客户端跑 /memories）。
  # 默认 FALSE——CAPI 是否接受该 typed 描述符未实测（GHC 仅在直连 BYOK 路径发，不经 CAPI）。为 true 且模型支持时，把客户端
  # `memory` 工具改写为 {name,type} 并强制 context-management beta；由客户端执行、无响应侧处理。关闭时按普通 custom tool 透传。
  server_tool_memory: false

  # Additional tool names that should never be deferred when tool_search is enabled.
  # tool_search 启用时额外永不延迟的工具名。
  # tool_search_non_deferred:
  #   - my_custom_tool

  # Cache control mode for prompt caching. / prompt 缓存的 cache control 模式。
  #   disabled:    strip all cache_control fields (no caching) / 剥离所有 cache_control 字段（不缓存）
  #   passthrough: forward client cache_control as-is (default) — clients like Claude Code send / 原样转发客户端 cache_control（默认）——Claude Code 等客户端
  #                their own well-tuned conversation breakpoints; the proxy stays out of the way / 自带调优过的对话断点，代理不插手
  #   sanitize:    forward but normalize to { type: "ephemeral" } (strip non-standard fields like scope) / 转发但归一化为 { type: "ephemeral" }（剥离 scope 等非标准字段）
  #   proxied:     proxy controls injection — strip client breakpoints, then re-inject GHC-style: / 代理控制注入——剥光客户端断点后再注入 GHC 风格：
  #                message-level breakpoints (last tool_result per round + current user message + / 消息级断点（每轮最后一个 tool_result + 当前 user 消息 +
  #                terminal assistant) caching the conversation, then tools/system on spare slots. / 终态 assistant）缓存对话，再用余位给 tools/system
  #                Use for clients that don't send their own cache_control. / 适用于不自带 cache_control 的客户端
  cache_control: passthrough

  # Extended prompt-cache TTL (extended-cache-ttl-2025-04-11): upgrade the cache_control breakpoints the
  # proxy WRITES from Anthropic's default 5m to 1h. Only takes effect when the proxy owns breakpoints —
  # i.e. cache_control: proxied (injects) or sanitize (upgrades existing client breakpoints); passthrough
  # / disabled ignore it. Also gated by model support (model_capabilities.extended_cache_ttl above) and an
  # agent-style request (an assistant message is present — mirrors GHC's Agent-location gate; first-turn
  # calls get no 1h). The extended-cache-ttl-2025-04-11 beta header is sent iff a 1h ttl actually lands in
  # the body. tools_system_ttl / messages_ttl pick 5m|1h per layer; messages is clamped ≤ tools_system
  # (Anthropic requires longer TTLs earlier in the tools→system→messages prefix order).
  # 扩展 prompt-cache TTL：把代理写入的 cache_control 断点从默认 5m 提到 1h。仅当代理自己写断点时生效——即 cache_control:
  # proxied（注入）或 sanitize（升级既有客户端断点）；passthrough / disabled 忽略。还受模型支持（上方 model_capabilities.
  # extended_cache_ttl）与 agent 式请求（存在 assistant 消息，镜像 GHC Agent 门；首轮无 1h）门控。beta 头当且仅当 body 真
  # 落了 1h ttl 才发。tools_system_ttl / messages_ttl 逐层选 5m|1h；messages 夹到 ≤ tools_system（Anthropic 要求长 TTL 在前）。
  extended_cache_ttl:
    enabled: false
    tools_system_ttl: 1h
    messages_ttl: 5m

  # Policy for Claude Code "Warmup" requests. / Claude Code "Warmup" 请求处理策略。
  # Claude Code sends warmup requests on session start to pre-fill the prompt cache. / Claude Code 在会话开始时发 warmup 请求预热 prompt 缓存。
  # Zombie processes may send these repeatedly, generating significant traffic. / 僵尸进程可能反复发送，制造可观流量。
  #   allow:  pass through to upstream API (default) / 透传到上游 API（默认）
  #   reject: return HTTP 429 error / 返回 HTTP 429 错误
  #   drop:   return minimal empty response without forwarding upstream / 返回最小空响应、不转发上游
  #   fake:   return realistic response with cache_creation_input_tokens (recommended) / 返回带 cache_creation_input_tokens 的逼真响应（推荐）
  warmup: allow

  # Rewrite system-reminder tags in messages. false = keep all (default), true = remove all.
  # 改写消息中的 system-reminder 标签。false = 全部保留（默认），true = 全部移除。
  # Or provide rewrite rules (first match wins, top-down). / 或提供改写规则（自上而下、首个匹配胜出）。
  # Note: `model` field is NOT supported here (only in system_prompt_overrides). / 注：此处不支持 `model` 字段（仅 system_prompt_overrides 支持）。
  # system_rewrite_reminders: false
  # system_rewrite_reminders:
  #   - from: "^Whenever you read a file, you should consider whether it would be considered malware"
  #     to: ""                 # Empty = remove the tag / 空 = 移除该标签

  # Upstream→client response-header forwarding MODE (Anthropic path). Selects which list below is active. The proxy is otherwise fully isolating — it synthesizes its own response headers, so upstream request-id / anthropic-ratelimit-* / anthropic-organization-id never reach the client. Both modes ALWAYS first drop a proxy-controlled floor (content-length / content-type / content-encoding / transfer-encoding / connection / hop-by-hop / cache-control / date / set-cookie) — forwarding upstream content-length after the proxy re-serializes the body corrupts client parsing. Client-side mirror of strict_request_headers.
  #   false (default) = BLACKLIST mode: forward EVERYTHING (minus the floor) except response_header_blacklist globs.
  #   true            = WHITELIST mode: forward ONLY response_header_whitelist globs (still minus the floor).
  # Note: only the non-committed write-out paths forward (non-streaming + streaming settled within the commit window). A delayed-commit stream that already flushed its 200 cannot forward (upstream headers arrive after the headers are on the wire). history records what the client actually received (inboundResponse) plus the full upstream set (outboundResponse).
  # 上游→客户端响应头转发模式（Anthropic 路径）。决定下面哪个名单生效。代理默认完全隔离——自己合成响应头，故上游 request-id / anthropic-ratelimit-* / anthropic-organization-id 到不了客户端。两模式都先强制剥除 proxy-controlled 地板（content-length / content-type / content-encoding / transfer-encoding / connection / hop-by-hop / cache-control / date / set-cookie）——代理重新序列化 body 后转发上游 content-length 会让客户端按错长度解析。是 strict_request_headers 的响应侧镜像。
  #   false（默认）= BLACKLIST 模式：转发除地板与 response_header_blacklist glob 命中者外的全部。
  #   true        = WHITELIST 模式：只转发 response_header_whitelist glob 命中者（仍先过地板）。
  # 注：只有非 committed 写出路径会转发（非流式 + 流式在 commit 窗口内 settle）。延迟-commit 已 flush 200 的流无法转发（上游头在响应头已上线后才到）。history 忠实记录客户端实收（inboundResponse）+ 上游全量（outboundResponse）。
  strict_response_headers: false

  # BLACKLIST-mode glob list (header name; * / ?): upstream response headers stripped from the forwarded set (active when strict_response_headers is false). Acts on the security-floor subset ONLY (never the proxy-controlled floor). Default [] strips nothing — identical to the old permissive strict_response_headers:false.
  # BLACKLIST 模式 glob 列表（头名；* / ?）：从转发集里剥除的上游响应头（strict_response_headers 为 false 时生效）。只作用于安全地板子集（绝不动 proxy-controlled 地板）。默认 [] 不剥任何头——与旧的尽量透传 strict_response_headers:false 完全一致。
  # retain-on-absence：删除此键会保留当前运行值；[] 清空。要恢复默认请用 reset（PUT /api/config），而非删键。
  response_header_blacklist: []

  # WHITELIST-mode glob list (header name; * / ?): the ONLY upstream response headers forwarded (active when strict_response_headers is true). [] forwards nothing (full isolation). Default = the known-safe allowlist — identical to the old strict strict_response_headers:true. retain-on-absence (same semantics as the blacklist).
  # WHITELIST 模式 glob 列表（头名；* / ?）：唯一被转发的上游响应头（strict_response_headers 为 true 时生效）。[] 表示不转发任何头（完全隔离）。默认 = 已知安全的 allowlist——与旧的严格 strict_response_headers:true 完全一致。retain-on-absence（语义同 blacklist）。
  response_header_whitelist:
    - request-id
    - x-request-id
    - anthropic-ratelimit-*
    - anthropic-organization-id
    - retry-after

  # Delayed-commit window (seconds) for streaming. 0 = commit immediately; default 20. Before opening the 200 SSE stream, the proxy waits up to N seconds for the upstream to settle: if it returns/errors WITHIN the window the real HTTP status is forwarded (the client keeps native retry/backoff/token-refresh); if it stays silent past the window (opus pre-response thinking) the proxy COMMITS a 200 + an immediate cold-start ping, and later errors degrade to a rich SSE error frame. Clamped well under the ~60s client idle deadline.
  # 流式延迟-commit 窗口秒数。0 = 立即 commit；默认 20。开 200 SSE 流之前，代理最多等 N 秒让上游 settle：窗口内返回/报错→转发真 HTTP 状态（客户端保留原生重试/退避/token 刷新）；超窗口仍静默（opus pre-response thinking）→ COMMIT 200 + 立即冷启动 ping，之后错误降级成富 SSE error 帧。clamp 到远低于 ~60s 客户端空闲死线。
  stream_commit_after_sec: 20

  # Client-proxy keepalive ping cadence (seconds) for streaming. 0 = disabled; default 20. After the commit window opens the 200 SSE stream, a connection-level heartbeat (decoupled from the upstream) pings every N seconds since the last client write — whether the upstream is silent, thinking, or buffered — so a long mid-stream/buffered stall never trips Claude Code's ~60s idle watchdog. Cadence = the MINIMUM interval between pings (a real frame or ping advances the anchor); a cold-start commit fires one immediate ping, then this throttles the rest. Clamped to a large margin under 60 (empirical safe ceiling ~45s). Heartbeats do NOT reset the upstream idle-timeout (a dead upstream still fails per timeouts.stream_idle); recorded only in forwardedSseEvents.
  # 客户端-代理流式 keepalive ping cadence 秒数。0 = 禁用；默认 20。commit 窗口开 200 后，连接级心跳（与上游解耦）距上次写客户端 N 秒就发一帧 ping——无论上游静默/thinking/buffered——故长 mid-stream/buffered 停滞绝不触发 Claude Code ~60s 空闲看门狗。cadence = ping 之间的最小间隔（真帧或 ping 都推进锚点）；冷启动 commit 先发一个立即 ping，之后由它节流。clamp 到远低于 60 的大余量（实测安全上界 ~45s）。心跳不重置上游 idle-timeout；只记入 forwardedSseEvents。
  stream_keepalive_ping_sec: 20

  # Keepalive FRAME type for the client-facing Anthropic stream. Three modes:
  #   ping (default) — a bare `event: ping`. Does NOT reset CC's 300s no-real-content deadline (a ping is
  #     not a "chunk"; exp/cc-idle-280s/REPORT.md), so a >300s pre-content silence CAN still time out — an
  #     accepted limit pending a real keepalive (docs/todo/2026-07-22-client-proxy-keepalive-300s.md).
  #   empty_text — RETIRED as default (ADR 2026-07-22 D2). Injected an empty content delta / synthetic
  #     empty-text ANCHOR block, but an empty text block is wrong-shaped AND G2-proven unable to reset the
  #     300s deadline on the proxy path. Code kept dormant/selectable for keepalive research only.
  #   enveloped_ping — synthetic envelope + bare ping. Experimental; expected to time out on long silence.
  # 客户端流式 keepalive 帧类型。三种模式：
  #   ping（默认）——裸 `event: ping`。重置不了 CC 的 300s 死线（ping 不算 chunk，见 exp/cc-idle-280s/REPORT.md），故 >300s pre-content 静默仍可能超时——已接受的限制，待真保活方案（docs/todo/2026-07-22-client-proxy-keepalive-300s.md）。
  #   empty_text —— 已退役默认（ADR 2026-07-22 D2）。曾注入空 content delta / 合成空-text 锚点块，但空 text block 是错误形状且 G2 实证不能重置 300s 死线。代码保留休眠/可选，仅供保活调研。
  #   enveloped_ping —— 合成信封 + 裸 ping。实验模式；长静默预期仍超时。
  stream_keepalive_mode: ping

  # L2 — transactional buffered retry for streaming generations cut short by an upstream mid-stream RST (GHC NGHTTP2_CANCEL on large Write/Edit in huge contexts). Buffers the whole response and commits only after message_stop, re-running the upstream exchange on a transport-close / truncation — so the client transparently receives ONE complete generation instead of a half stream + error. See docs/rfc/streaming-upstream-rst-buffered-retry.md.
  # L2——针对被上游流中途 RST（超大上下文里大 Write/Edit 触发 GHC NGHTTP2_CANCEL）砍断的流式生成的事务化缓冲重试。缓冲整响应、`message_stop` 后才 commit，transport-close/truncation 则重跑上游交换——客户端透明地拿到一次完整生成而非半截流 + 错误。详见 docs/rfc/streaming-upstream-rst-buffered-retry.md。
  #   false:           disabled (default) — live streaming, no buffering. / 禁用（默认）——实时流式，不缓冲。
  #   on:              buffer every streaming Anthropic response. / 缓冲每个流式 Anthropic 响应。
  #   tool_use_only:   buffer only when the request carries `tools` (the large Write/Edit scenario); pure-text chat stays live. / 仅当请求带 `tools`（大 Write/Edit 场景）才缓冲；纯文本对话仍实时。
  protect_streaming_generation: false
  # On each buffered RST/truncation retry, FORCE a progressively aggressive native clear_tool_uses context_management edit (lower trigger + smaller keep) to compress the context so the generation finishes faster — within the next RST window. Independent of context_editing (retry-only emergency compression); skipped when the model doesn't support context_management. Changes request semantics (drops more old context). Default false (opt-in; enable only after telemetry shows plain retry's hit rate is low for over-budget requests).
  # 每次缓冲 RST/truncation 重试时，FORCE 一次渐进激进的原生 clear_tool_uses context_management（更低 trigger + 更少 keep）压缩上下文，让生成更快、更可能在下个 RST 窗口前完成。独立于 context_editing（仅重试时的应急压缩）；模型不支持 context_management 时跳过。改变请求语义（删更多旧上下文）。默认 false（opt-in；建议遥测证实裸重试命中率低后再开）。
  protect_streaming_escalate_context: false

  # Policy for assistant messages containing thinking/redacted_thinking blocks. Thinking signatures are self-contained (encrypt the thinking content itself; no context/position binding — empirically verified), so block-level protection suffices.
  # 含 thinking/redacted_thinking 块的 assistant 消息处理策略。thinking signature 自包含（加密 thinking 内容本身、不绑定上下文/位置——已实测验证），故块级保护即足够。
  #   preserve: keep thinking blocks verbatim + don't reorder consecutive thinking, but allow all surrounding cleanup (default)
  #             逐字保留 thinking 块、不重排连续 thinking，但允许周围一切清理（默认）
  #   stripped: actively delete thinking blocks from old messages / 主动从旧消息删除 thinking 块
  thinking_block_message_policy: preserve

  # De-stack adjacent thinking/redacted_thinking blocks so no two are consecutive in an assistant message — GHC rejects an echoed history with stacked thinking ("thinking blocks cannot be modified" 400). Idempotent: a message without adjacent thinking passes through byte-identical.
  # 分隔 assistant 消息中相邻的 thinking/redacted_thinking 块使其两两不相邻——GHC 拒绝回显历史里堆叠的 thinking（报 "thinking blocks cannot be modified" 400）。幂等：无相邻 thinking 的消息逐字透传。
  #   passthrough: leave stacked thinking as-is / 保留堆叠的 thinking，不改动
  #   insert_text: insert a synthetic text separator between adjacent thinking / 在相邻 thinking 间插入合成文本分隔符
  #   move_blocks: interleave thinking with real non-thinking blocks (order-preserving), synthetic marker only when insufficient (default) / 与真实非 thinking 块交错（保序），不足时才用合成标记（默认）
  thinking_destack_strategy: move_blocks

  # Reactive fallback (L2) for the GHC "thinking ... cannot be modified" 400 that L1 de-stack (thinking_destack_strategy) did not preempt: strip ALL thinking/redacted_thinking blocks from the echoed history and retry the turn once. true = enable the one-shot strip-and-retry (default); false = let the 400 surface unmodified.
  # 对 GHC "thinking ... cannot be modified" 400 的反应式兜底（L2），处理 L1 去堆叠（thinking_destack_strategy）未能预防的情形：从回显历史中剥离全部 thinking/redacted_thinking 块并重试一次。true = 启用一次性剥离重试（默认）；false = 让该 400 原样抛出。
  strip_thinking_on_reject: true

  # L3 durable quarantine (master switch) for the "thinking ... cannot be modified" 400. When true (default), a successful L2 strip-all retry REMEMBERS the offending (session, agent) conversation in a sidecar SQLite store, so later turns are stripped proactively — skipping the reactive 400+retry round-trip. false = keep only the per-turn L2 reaction (no remembering).
  # 针对 "thinking ... cannot be modified" 400 的 L3 持久隔离（总开关）。true（默认）时，L2 剥离重试一旦成功，就把出问题的 (session, agent) 会话记进旁路 SQLite 存储，使后续轮次提前剥离 thinking——省去反应式的 400+重试往返。false = 仅保留每轮的 L2 反应（不记忆）。
  poisoned_thinking_quarantine: true

  # Sliding TTL (hours) of an L3 quarantine entry: a conversation stays quarantined this long since its last observed poison hit; one quiet longer than this drops out (its thinking is no longer pre-stripped). Default 72.
  # L3 隔离条目的滑动 TTL（小时）：会话自最近一次命中 poison 起保持隔离这么久；静默超过此时长的会话退出隔离（其 thinking 不再被提前剥离）。默认 72。
  poisoned_thinking_ttl_hours: 72

  # Drop corrupt thinking blocks before sending upstream — validity decided by SIGNATURE, not text (encrypted thinking has empty text + valid signature, kept by the default mode).
  # 发送上游前剥离损坏的 thinking 块——有效性由 signature 而非文本判定（加密 thinking 文本为空但有有效 signature，默认模式下保留）。
  # 模式名 = 哪个字段为空才触发丢弃（text = thinking 明文，signature = 签名封印）：
  #   all_empty:       remove blocks where text AND signature are BOTH empty (double-empty corruption) (default) / 移除文本与 signature 都空的块（双空损坏）（默认）
  #   signature_empty: remove any block with empty signature, regardless of text / 移除任何 signature 为空的块（不论文本）
  #   thinking_empty:  remove any block with empty text, regardless of signature — AGGRESSIVE, also deletes legit encrypted thinking / 移除任何文本为空的块（不论 signature）——激进，会删正常加密 thinking，慎用
  #   any_empty:       remove a block when EITHER field is empty / 任一字段为空即移除
  #   false:           disable / 禁用
  thinking_block_sanitize: all_empty

  # Coerce legacy thinking params for adaptive-only models (opus 4.6/4.7/4.8).
  # 为仅支持 adaptive 的模型（opus 4.6/4.7/4.8）强制转换旧版 thinking 参数。
  # Old clients send thinking:{type:enabled,budget_tokens} which these models reject with a 400 demanding type:adaptive. This rewrites enabled→adaptive on the wire.
  # 旧客户端发 thinking:{type:enabled,budget_tokens}，这些模型会 400 要求 type:adaptive。本项在 wire 上把 enabled→adaptive。
  #   basic:       coerce to {type:adaptive}, drop budget_tokens (default, mirrors GHC) / 转为 {type:adaptive} 丢弃 budget_tokens（默认，对齐 GHC）
  #   best_effort: also map budget_tokens to output_config.effort (only if the client didn't send an explicit effort) — heuristic, GHC doesn't do this / 并把 budget_tokens 启发式换算为 output_config.effort（仅客户端未显式发 effort 时）——GHC 不这么做
  #   false:       disable — pass client thinking config through unchanged / 禁用——原样透传客户端 thinking 配置
  thinking_coerce_adaptive: basic

  # Client compatibility shim for the streaming thinking frame some Copilot upstreams emit (signature embedded in content_block_start, no signature_delta) so standard clients keep the signature.
  # 客户端兼容 shim：部分 Copilot 上游发出的流式 thinking 帧（signature 嵌在 content_block_start、无 signature_delta），重整形使标准客户端保留签名。
  #   signature_delta (default) | redacted_thinking | false / signature_delta（默认）| redacted_thinking | false
  thinking_signature_compat: signature_delta

  # Strip <system-reminder> tags from Read tool results / 从 Read 工具结果剥离 <system-reminder> 标签
  tool_strip_read_result_tags: false

  # Server-side context editing mode. Controls how Anthropic's context_management trims older context when input grows large.
  # 服务端上下文编辑模式。控制输入增大时 Anthropic 的 context_management 如何修剪旧上下文。
  #   off: disabled (default). No context_management sent. / 禁用（默认），不发送 context_management。
  #   clear-thinking: clear old thinking blocks. / 清除旧 thinking 块。
  #   clear-tooluse: clear old tool_use/result pairs. / 清除旧 tool_use/result 对。
  #   clear-both: apply both clear-thinking and clear-tooluse. / 同时应用 clear-thinking 与 clear-tooluse。
  # Only effective for models that support context editing. / 仅对支持上下文编辑的模型生效。
  context_editing: off

  # Input token threshold that triggers clear_tool_uses when context_editing includes tool clearing.
  # context_editing 含工具清理时触发 clear_tool_uses 的输入 token 阈值。
  context_editing_trigger: 100000

  # Number of most recent tool_use pairs to keep after clear_tool_uses runs. / clear_tool_uses 运行后保留的最近 tool_use 对数量。
  context_editing_keep_tools: 3

  # Number of most recent thinking turns to keep after clear_thinking runs. / clear_thinking 运行后保留的最近 thinking turn 数量。
  context_editing_keep_thinking: 1

  # Per-model partner-model features the upstream org policy disallows. Config twin of the runtime negotiation cache (partnerFeatures) — declared features are stripped on the FIRST request, no reactive 400 + degrade-warn round-trip.
  # per-model 声明上游 org policy 禁用的 partner-model 特性。是运行时协商缓存（partnerFeatures）的 config 孪生——声明的特性首发即剥，免一次 400 + 降级 warn 往返。
  # `structured_outputs` for claude-sonnet-4.6: this account routes sonnet-4.6 to Vertex AI, whose org policy `allowedPartnerModelFeatures` blocks it; clients (Claude Code's title generator) send `output_config.format`, so the proxy strips that field. Value is the feature NAME, not the internal path.
  # claude-sonnet-4.6 的 structured_outputs：本账号把 sonnet-4.6 路由到 Vertex AI，其 org policy `allowedPartnerModelFeatures` 禁用它；客户端（Claude Code 标题生成器）会发 `output_config.format`，故代理剥该字段。值是特性名而非内部路径。
  partner_strip_features:
    claude-sonnet-4.6:
      - structured_outputs

  # ---------------------------------------------------------------------------
  # Body field pre-filter / Body 字段预过滤
  # ---------------------------------------------------------------------------
  # Strip top-level body fields from outbound Anthropic payloads per model. / 按模型从出站 Anthropic payload 剥离顶层 body 字段。
  # Keys are model-name substrings; "*" applies to every model. / 键是模型名子串；"*" 应用到所有模型。
  # Match semantics (strip-list — additive): every matching key contributes its fields to the strip set, including "*". / 匹配语义（剥离表——叠加）：每个匹配键（含 "*"）都把其字段并入剥离集。
  # Always merged with the built-in default {"*": [inference_geo]} and with runtime-learned entries from upstream `<field>: Extra inputs are not permitted` 400 errors (persisted in negotiation-states.json). / 始终与内置默认 {"*": [inference_geo]} 及运行时学习项（来自上游 400、持久化于 negotiation-states.json）合并。
  #
  # Default: none (only built-in inference_geo strip + runtime negotiation). / 默认：无（仅内置 inference_geo 剥离 + 运行时协商）。
  # retry_reject_body_fields:
  #   "*": [some_global_field]
  #   claude-opus-4.7: [model_specific_field]

  # ---------------------------------------------------------------------------
  # Response-wire fixes / 响应 wire 修复
  # ---------------------------------------------------------------------------
  # Fixes applied to the Anthropic RESPONSE before forwarding to the client, grouped by which block
  # they target: `response_text_fix` (text blocks) and `response_tool_use_fix` (tool_use blocks).
  # 在转发给客户端前对 Anthropic 响应做的修复，按作用的块分组：`response_text_fix`（text 块）与 `response_tool_use_fix`（tool_use 块）。
  # History records keep the upstream-original form — these never touch sseEvents or the stored response, so the upstream anomaly stays visible in history.
  # 历史记录保留上游原始形态——这些修复绝不碰 sseEvents 或存储响应，故上游异常在历史中仍可见。
  response_text_fix:
    # invoke_in_text: transparently recover a tool call the upstream degraded into plain text (`call<invoke>…`), rebuilding it into a standard tool_use block.
    # invoke_in_text：透明恢复上游降级成纯文本（`call<invoke>…`）的工具调用，重建为标准 tool_use block。
    # Default false (enable only when the upstream degradation is confirmed). See docs/rfc/tool-call-text-recovery.md. / 默认 false（仅在确认遭遇该上游降级时开启）。
    invoke_in_text: true

  response_tool_use_fix:
    # decode_top_level_field: per-tool list of top-level input fields to decode from a stringified JSON string back to structured form (e.g. AskUserQuestion with `questions: "[{...}]"`).
    # decode_top_level_field：每工具要从 stringified JSON 字符串 decode 回结构化形式的顶层 input 字段列表（如 AskUserQuestion 的 `questions: "[{...}]"`）。
    #   Keys are tool names, matched verbatim (no normalization). Replace semantic: setting this key replaces the whole map (write {} to disable). Default: { AskUserQuestion: [questions] }.
    #   键是逐字匹配的工具名（不归一化）。replace 语义：设此键替换整个 map（写 {} 禁用）。默认：{ AskUserQuestion: [questions] }。
    decode_top_level_field:
      AskUserQuestion:
        - questions

    # malformed_input: repair malformed tool_use input JSON the upstream occasionally leaks. A COMMA-SEPARATED SET of repair items (order in the string is ignored; items cascade in a fixed canonical order and stack on each other). Forwarded stream only.
    #   ""            = off — forward the malformed bytes as-is.
    #   tags          = structure-aware antml-tag stripping (fixes antml wrapper tags like `…]</parameter></invoke>` bleeding into the input).
    #   unicode       = whitespace-broken `\uXXXX` escape fix (e.g. `\u9 ed8` → 默; jsonrepair THROWS on these so it needs its own item).
    #   jsonrepair    = jsonrepair structural fix (missing brackets / truncated structures; heuristic).
    #   unicode-lossy = LOSSY last resort — un-completable `\uXXXX` escapes (a hex digit dropped) → U+FFFD. Runs AFTER all lossless items; only reached when they fail.
    # If no enabled item yields valid JSON, the request is recorded failed + a synthetic error frame is emitted (never a silent broken tool call). See docs/spec/anthropic-malformed-tool-input-repair.md.
    # malformed_input：修复上游偶发漏出的畸形 tool_use input JSON。逗号分隔的修复项目集（字符串里的顺序无关；项目按固定规范顺序级联、互相叠加）。仅作用于转发流。
    #   ""            = 关——原样转发畸形字节。
    #   tags          = 结构感知剥 antml 标签。  unicode = 修空白打断的 `\uXXXX` 转义。  jsonrepair = jsonrepair 结构修复。  unicode-lossy = 有损兜底（无法凑齐的 `\uXXXX`→U+FFFD，排最后）。
    malformed_input: "tags,unicode,unicode-lossy,jsonrepair"

    # send_message_to_missing: recover a missing SendMessage `to` recipient from a misnamed alias (agentId / agent_id / agent) — the client rejects a SendMessage call whose required `to` is absent.
    # send_message_to_missing：从错名的别名（agentId / agent_id / agent）抢救 SendMessage 缺失的 `to` 收件人（客户端拒收缺必填 `to` 的 SendMessage 调用）。
    #   Root cause: a finished subagent's tool_result text reads `agentId: <id> (use SendMessage with to: '<id>')`, so the model copies the camelCase LABEL as the param name. Only touched when `to` is absent and an alias holds a non-empty string (present-but-empty `to` is left alone). Default: true.
    #   根因：subagent 完成时 tool_result 文本写 `agentId: <id> (use SendMessage with to: '<id>')`，模型把 camelCase 标签抄成了参数名。仅当 `to` 缺失且某别名为非空字符串时处理（present-but-empty `to` 不动）。默认 true。
    send_message_to_missing: true

    # ask_user_question_question_missing: Claude Code rejects an AskUserQuestion `questions[]` item that has a `header` but no `question` field ("must have a question").
    # ask_user_question_question_missing：Claude Code 拒收有 `header` 却缺 `question` 字段的 AskUserQuestion `questions[]` item。
    #   Each item MISSING the `question` key (present-but-empty is left untouched) whose `header` is a non-empty string gets `question = header`. Runs after decode_top_level_field. Default: true.
    #   缺 `question` 键（present-but-empty 不动）且 `header` 非空者回填 `question = header`，在 decode_top_level_field 之后运行。默认 true。
    ask_user_question_question_missing: true

  # How to handle the upstream thinking-only refusal (stop_reason:"refusal" with only a thinking block, no text/tool_use). Three modes:
  #   "refusal"  = pass the upstream refusal through unchanged (client gets a dead/empty turn).
  #   "end_turn" = append a synthetic text block explaining the refusal + flip stop_reason to end_turn (a usable completion).
  #   "error"    = emit an Anthropic `event: error` SSE frame AND record the request as failed (ctx.fail) — the refusal surfaces as an error, not a fake success.
  # 上游 thinking-only refusal（stop_reason:"refusal" 仅有 thinking 块、无 text/tool_use）的处理策略，三选一：
  #   "refusal"  = 透传上游 refusal、不改写（客户端拿到空/坏轮）。
  #   "end_turn" = 追加合成 text 块说明拒绝 + 把 stop_reason 改成 end_turn（可用的完成）。
  #   "error"    = 发 Anthropic `event: error` SSE 帧并把请求记为失败（ctx.fail）——refusal 以错误而非伪成功呈现。
  # Forwarded stream only (history's sseEvents keeps the upstream-original refusal). Default "error". See docs/refusal-recovery.md.
  # 仅作用于转发流（history 的 sseEvents 保留上游原始 refusal）。默认 "error"。详见 docs/refusal-recovery.md。
  refusal_sse_rewrite: error

# ============================================================================
# Responses API
# ============================================================================
# Settings for OpenAI Responses API (/v1/responses) endpoint. / OpenAI Responses API（/v1/responses）端点设置。

openai_responses:
  # Convert `call_xxx` IDs to `fc_xxx` in input. Required when clients send conversation history with Chat Completions-format tool call IDs to the Responses API (which requires `fc_` prefix). Default: true.
  # 把 input 中的 `call_xxx` ID 转为 `fc_xxx`。客户端用 Chat Completions 格式的 tool call ID 向 Responses API（需 `fc_` 前缀）发对话历史时需要。默认 true。
  # NOTE: this toggle only governs the `call_`→`fc_` REWRITE (which also touches `call_id`). Independently of it, an
  # unconditional wire backstop always STRIPS any non-`fc_` `function_call` item `id` (matching is by `call_id` alone),
  # so a request never carries an item id that upstream rejects with "Expected an ID that begins with 'fc'".
  # 注意：本开关只控制 `call_`→`fc_` 改写（会同时动 `call_id`）。与之独立，一个无条件的 wire backstop 总会剥掉任何非-`fc_` 的
  # `function_call` item `id`（匹配只靠 `call_id`），故请求绝不会带上游拒绝的非法 item id。
  normalize_call_ids: true

  # Use upstream WebSocket transport for streaming /responses when the model supports it.
  # 模型支持时为流式 /responses 启用上游 WebSocket 传输。
  # Connections are reused across tool-call rounds via `previous_response_id` or session header.
  # 连接经 `previous_response_id` 或 session header 跨工具调用轮复用。
  # WS failures fall back to HTTP transparently; 3 consecutive fallbacks temporarily disable WS for 5 minutes (single half-open probe on expiry). Default: false.
  # WS 失败透明回退 HTTP；连续 3 次回退临时禁用 WS 5 分钟（到期单次半开探针）。默认 false。
  upstream_ws: false

  # Fix inconsistent item IDs across `output_item.added` / `output_item.done` events from Copilot's upstream stream. Required by `@ai-sdk/openai` which validates ID continuity. Default: true.
  # 修复 Copilot 上游流在 `output_item.added` / `output_item.done` 间不一致的 item ID。`@ai-sdk/openai` 校验 ID 连续性需要。默认 true。
  fix_stream_ids: true

# ============================================================================
# Generation runtime / 生成运行时
# ============================================================================
generation:
  hedge:
    # Start one secondary request after this many seconds without a complete real client block. Synthetic keepalive scaffold does not close the window.
    # 首个物理请求在此秒数后仍无真实完整客户端 block 时启动一个 secondary。合成 keepalive 脚手架不关闭窗口。
    # The conservative 300s default targets the Claude Code no-real-content watchdog tail; this is not an ordinary low-latency hedge.
    # 保守默认 300 秒用于兜住 Claude Code 的 no-real-content watchdog 尾部，不是普通低延迟竞速。
    enabled: true
    threshold_sec: 300
    max_secondary_candidates: 1
    # Server-executed tools may run twice and consume duplicate quota; keep disabled unless explicitly accepted.
    # server-side tool 可能重复执行并消耗双份额度；仅在明确接受风险时开启。
    allow_server_tools: false
  recovery:
    max_candidates: 3
  max_active_candidates: 2
  max_active_dispatches: 2
  max_total_candidates: 5
  max_total_dispatches: 16
  cleanup_grace_sec: 10

# ============================================================================
# Server / inbound ingress / 服务端·入站
# ============================================================================
# Client-facing inbound limits — distinct from upstream_transport.* (outbound to GHC).
# 面向客户端的入站限制——区别于 upstream_transport.*（出站到 GHC）。

server:
  responses_ws:
    # Keep the client-side WebSocket open after `response.completed` so the client can issue follow-up `response.create` frames on the same socket. When false (default), the socket closes with code 1000 after each request (HTTP-like one-shot semantics).
    # 在 `response.completed` 后保持客户端侧 WebSocket 打开，让客户端在同一 socket 上发后续 `response.create`。false（默认）时每次请求后以 code 1000 关闭（HTTP 式一次性语义）。
    # Concurrent `response.create` on the same socket is rejected with an error frame. / 同 socket 上并发 `response.create` 会被 error 帧拒绝。
    keep_open: false
    # Max inbound client WS frame bytes (0 = unlimited). / 客户端入站 WS 帧字节上限（0 = 无限）。
    # max_frame_bytes: 0
    # Max concurrent client WS connections (0 = unlimited). / 客户端并发 WS 连接数上限（0 = 无限）。
    # max_connections: 256


# ============================================================================
# Tool Name Sanitization / 工具名清洗
# ============================================================================
# Sanitize tool names that violate the target model's constraints (illegal characters like dots, over-length, or collisions) into legal names before sending upstream, then restore the client's original names in the response. Deterministic and stateless (rebuilt per request). Spans Anthropic + Chat Completions + Responses paths. Top-level (cross-protocol), not under anthropic.*. Default: false.
# 发送上游前把违反目标模型约束的工具名（点号等非法字符、超长、冲突）清洗为合法名，再在响应里还原客户端原始名。确定性且无状态（每请求重建）。跨 Anthropic + Chat Completions + Responses 三条路径。顶层（跨协议），不在 anthropic.* 下。默认 false。
sanitize_tool_names: true

# ============================================================================
# Client Query-String Forwarding / 客户端 query string 转发
# ============================================================================
# Faithfully forward the client's inbound query string to the upstream completion endpoint (Anthropic / Chat Completions / Responses / Gemini) so params like ?beta=true reach GHC. Format-agnostic, top-level (cross-protocol). A built-in security floor is ALWAYS stripped (api-version / key / access_token / alt) — auth secrets and params the proxy itself consumes. History records the client's raw query (inboundRequest) and the filtered forwarded query (outboundRequest) separately. Default: true.
# 把客户端入站 query string 忠实转发到上游完成端点（Anthropic / Chat Completions / Responses / Gemini），让 ?beta=true 等参数到达 GHC。格式无关、顶层（跨协议）。内置安全底线键始终剥离（api-version / key / access_token / alt）——auth 密钥与代理自身消费的参数。History 分别记录客户端原始 query（inboundRequest）与过滤后转发的 query（outboundRequest）。默认 true。
forward_client_query: true
# Extra query keys to strip beyond the built-in floor (case-insensitive, unioned with the floor). The floor keys cannot be un-stripped.
# 在内置安全底线之外额外剥离的 query 键（大小写不敏感，与底线取并集）。底线键无法被取消剥离。
forward_client_query_exclude: []
# Upstream Hook (dev/test only) / 上游 Hook（仅开发/测试环境）
# ============================================================================
# Declarative only: setting these keys never loads anything by itself. The module is loaded
# at startup when `enabled` is true (a future reload API will also honor this section).
# 仅声明态：这些键本身不会加载任何东西。`enabled` 为 true 时在启动期加载该模块（未来的 reload API 也会遵循本段）。

hooks:
  # Path to an ad-hoc TS hook module for mocking/intercepting upstream. Dev/test only.
  # 指向一个 ad-hoc TS hook 模块，用于 mock/拦截上游。仅开发/测试环境。
  # upstream_module: "./exp/my-hook.ts"
  # Load the hook module. Default false — the feature is fully off unless true.
  # 是否加载 hook 模块。默认 false——除非 true 否则特性完全关闭。
  enabled: false

# ============================================================================
# Unknown HTTP Endpoint Logging / 未知 HTTP 端点日志
# ============================================================================
# 打到代理但没匹配任何业务路由的请求（客户端打错 path / base URL / method）按归类状态码
# 分别控制日志级别。日志经 consola → TUI + copilot-api.log。
# Requests that reach the proxy but match no business route, logged per classified status.
#   not_found          → 404: real routing miss / 真正未匹配的路径
#   method_not_allowed → 405: path exists, wrong method (returns 405 + Allow header)
# Levels: silent (off) | debug | info | warn | error. Default warn/warn.
unknown_endpoint_logging:
  not_found: warn
  method_not_allowed: warn
