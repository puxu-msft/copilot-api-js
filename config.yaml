# ============================================================================
# Timeouts
# ============================================================================
# Timeout settings for upstream API connections. Apply to all streaming paths.

timeouts:
  # Max seconds between SSE events (0 = no timeout).
  # Applies to all streaming paths (Anthropic, Chat Completions, Responses).
  stream_idle: 900

  # Max seconds from request start to receiving HTTP response headers (0 = no timeout).
  # Applies to all upstream API clients.
  response_header: 900

  # Upstream TCP keepalive initial-probe delay in seconds (0 = use undici's 60s default).
  # Keeps the GHC connection alive through long opus thinking silences so NAT/firewall
  # idle reapers don't sever it ("terminated (cause: other side closed)"). Node-only.
  upstream_keepalive: 15

  # Max seconds an active request can live before the stale reaper forces it to fail (0 = disabled).
  # Safety net for requests that never complete/fail normally.
  stale_request_max_age: 900

# Seconds between background model list refreshes (0 = disabled).
# Keeps /models cache fresh for long-running instances without requiring a restart.
# (Stays top-level — a refresh interval, not a timeout.)
model_refresh_interval: 900

# ============================================================================
# Shutdown
# ============================================================================
# Control graceful shutdown timing.

shutdown:
  # Phase 2: seconds to wait for in-flight requests to complete naturally (default: 60)
  graceful_wait: 300
  # Phase 3: seconds to wait after abort signal for handlers to wrap up (default: 120)
  abort_wait: 120

# ============================================================================
# History
# ============================================================================
# Control history recording behavior.

history:
  # Successful (non-failed) entries kept in SQLite (0 = unlimited, default: 50)
  success_limit: 500
  # Failed entries kept in SQLite — larger by default for diagnostics (0 = unlimited, default: 200)
  failure_limit: 500
  # Seconds between reaper passes that trim each bucket (0 = disabled, default: 600)
  reaper_interval: 600

# ============================================================================
# Web Search (double-hop)
# ============================================================================
# Real web_search server-tool implementation for the Anthropic/Claude path.
# When enabled and a request carries a native web_search server tool (or Claude Code's WebSearch tool), the proxy intercepts it, runs a real search, and feeds the results back to the model for a second-pass answer (double-hop). Default off.

web_search:
  # Enable the double-hop web_search implementation (default: false)
  enabled: false
  # Search backend:
  #   ""        — disabled / not configured (default)
  #   "searxng" — local SearXNG instance at http://localhost:8080
  #   other     — a Copilot Responses search model id (e.g. "gpt-5.5")
  backend: ""

# ============================================================================
# Anthropic
# ============================================================================
# Settings for Anthropic API tool handling and timeouts.

anthropic:
  # Strip server-side tools (web_search, etc.) from requests.
  # This is the unconditional global switch. Even when false, a server tool the
  # upstream rejects with 400 ("web search tool is not supported") is learned and
  # stripped pre-emptively for that (endpoint, model) on subsequent requests
  # (server-tool-rejection self-healing). See docs/v4/03-spec/server-tool-rejection-retry.md
  tool_strip_server: false

  # Synthetic SSE keepalive interval (seconds) for the client-facing stream.
  # 0 = disabled (default). When >0, the proxy injects an Anthropic-protocol
  # `event: ping` frame whenever no real upstream event has been forwarded for
  # that many seconds — prevents the client (e.g. Claude Code ~258s) from
  # disconnecting while upstream is silent (notably opus-4.8 adaptive thinking
  # that stalls after content_block_start). Heartbeats DO NOT reset the
  # upstream idle-timeout (a dead upstream still fails per timeouts.stream_idle)
  # and are recorded only in forwardedSseEvents, never in raw upstream sseEvents.
  stream_fake_sse_heartbeat: 120

  # L2 — transactional buffered retry for streaming generations cut short by an
  # upstream mid-stream RST (GHC NGHTTP2_CANCEL on large Write/Edit in huge
  # contexts). Buffers the whole response and commits only after message_stop,
  # re-running the upstream exchange on a transport-close / truncation — so the
  # client transparently receives ONE complete generation instead of a half
  # stream + error. See docs/rfc/streaming-upstream-rst-buffered-retry.md.
  #   false:           disabled (default) — live streaming, no buffering.
  #   on:              buffer every streaming Anthropic response.
  #   tool_use_only:   buffer only when the request carries `tools` (the large
  #                    Write/Edit scenario); pure-text chat stays live.
  protect_streaming_generation: false
  # Max transport-close / truncation retries (loop/cost guard, NOT a timeout
  # guard — the client is kept alive by the forced heartbeat below). 0 = no retry.
  protect_streaming_max_retries: 3
  # Forced heartbeat interval (seconds) for the buffered path: the buffer
  # withholds all real frames until message_stop, so a heartbeat is constructed
  # UNCONDITIONALLY — using stream_fake_sse_heartbeat when >0, else this fallback.
  protect_streaming_heartbeat: 15

  # Dedup tool calls: false | "input" | "result" (true = "input" for compat)
  # "input": dedup by (name, input); "result": also require identical result
  tool_dedup_calls: false

  # Policy for assistant messages containing thinking/redacted_thinking blocks.
  # Thinking signatures are self-contained (encrypt the thinking content itself; no
  # context/position binding — empirically verified), so block-level protection suffices.
  #   preserve: keep thinking blocks verbatim + don't reorder consecutive thinking,
  #             but allow all surrounding cleanup (default)
  #   stripped: actively delete thinking blocks from old messages
  thinking_block_message_policy: preserve

  # Drop corrupt thinking blocks before sending upstream — validity decided by SIGNATURE, not text (encrypted thinking has empty text + valid signature, kept).
  #   empty_thinking: remove double-empty blocks (text AND signature empty) (default)
  #   empty_any:      remove any thinking block with empty signature
  #   false:          disable
  thinking_block_sanitize: empty_thinking

  # Coerce legacy thinking params for adaptive-only models (opus 4.6/4.7/4.8).
  # Old clients send thinking:{type:enabled,budget_tokens} which these models reject with a 400 demanding type:adaptive. This rewrites enabled→adaptive on the wire.
  #   basic:       coerce to {type:adaptive}, drop budget_tokens (default, mirrors GHC)
  #   best_effort: also map budget_tokens to output_config.effort (only if the client didn't send an explicit effort) — heuristic, GHC doesn't do this
  #   false:       disable — pass client thinking config through unchanged
  thinking_coerce_adaptive: basic

  # Handle role:"system" messages mixed into the messages array — illegal for the Anthropic API (system must be the top-level param), rejected with `Unexpected role "system"`.
  # Such inline system messages come from OpenAI-habit clients or Claude Code mid-conversation context injections (hook output / rules / reminders).
  #   as_user:      rewrite role to "user" — keeps conversation position (recommended)
  #   merge:        append their text to the top-level system, drop the messages (hurts prompt cache; loses position)
  #   drop_invalid: remove them entirely (loses the context)
  #   as_assistant: rewrite role to "assistant" (experimental, NOT recommended — disguises context as model output)
  #   false:        passthrough unchanged (default — will 400 upstream if present)
  system_messages_sanitize: false

  # Rewrite native server-tool blocks left in message history before sending upstream.
  # The web_search double-hop surfaces a synthesized server_tool_use{web_search} + web_search_tool_result pair to the client (so results are visible); the client echoes it back next turn, but the downgraded tools array no longer declares web_search as a server tool → upstream 400.
  # Recommended ON together with web_search.enabled.
  #   downgrade: rewrite the pair into plain tool_use + tool_result (splits the assistant turn so the tool_result lands in a user message)
  #   false:     passthrough (default — will 400 upstream when a historical server_tool_use survives without a matching server-tool definition)
  tool_rewrite_history_server: false

  # Client compatibility shim for the streaming thinking frame some Copilot upstreams emit
  # (signature embedded in content_block_start, no signature_delta) so standard clients keep the signature.
  #   signature_delta (default) | redacted_thinking | false
  thinking_signature_compat: signature_delta

  # Strip <system-reminder> tags from Read tool results
  tool_strip_read_result_tags: false

  # Server-side context editing mode. Controls how Anthropic's context_management trims older context when input grows large.
  #   off: disabled (default). No context_management sent.
  #   clear-thinking: clear old thinking blocks.
  #   clear-tooluse: clear old tool_use/result pairs.
  #   clear-both: apply both clear-thinking and clear-tooluse.
  # Only effective for models that support context editing.
  context_editing: off

  # Input token threshold that triggers clear_tool_uses when context_editing includes tool clearing.
  context_editing_trigger: 100000

  # Number of most recent tool_use pairs to keep after clear_tool_uses runs.
  context_editing_keep_tools: 3

  # Number of most recent thinking turns to keep after clear_thinking runs.
  context_editing_keep_thinking: 1

  # Inject Copilot tool_search helper when the model supports it.
  tool_search: true

  # Cache control mode for prompt caching.
  #   disabled:    strip all cache_control fields (no caching)
  #   passthrough: forward client cache_control as-is
  #   sanitize:    forward but normalize to { type: "ephemeral" } (strip non-standard fields like scope)
  #   proxied:     proxy controls injection — auto-add breakpoints on tools/system (default)
  cache_control: proxied

  # Additional tool names that should never be deferred when tool_search is enabled.
  # tool_non_deferred:
  #   - my_custom_tool

  # Rewrite system-reminder tags in messages. false = keep all (default), true = remove all.
  # Or provide rewrite rules (first match wins, top-down).
  # Note: `model` field is NOT supported here (only in system_prompt_overrides).
  # system_rewrite_reminders: false
  # system_rewrite_reminders:
  #   - from: "^Whenever you read a file, you should consider whether it would be considered malware"
  #     to: ""                 # Empty = remove the tag

  # Policy for Claude Code "Warmup" requests.
  # Claude Code sends warmup requests on session start to pre-fill the prompt cache.
  # Zombie processes may send these repeatedly, generating significant traffic.
  #   allow:  pass through to upstream API (default)
  #   reject: return HTTP 429 error
  #   drop:   return minimal empty response without forwarding upstream
  #   fake:   return realistic response with cache_creation_input_tokens (recommended)
  warmup: fake

  # Per-model supported effort levels (whitelist) for output_config.effort.
  # Keys are model name substrings matched against the resolved model name.
  # Values are arrays of supported efforts from: none, low, medium, high, xhigh, max.
  # Requests outside the whitelist are clamped to the nearest supported value (above max → max supported; below min → min supported).
  #
  # Match semantics (whitelist — single source of truth):
  #   - The MOST SPECIFIC (longest) key whose substring matches the model wins. e.g. for model "claude-opus-4.7-high", the key "claude-opus-4.7-high" beats "claude-opus-4.7"; only the winning key's values apply (no union).
  #   - The pseudo-key "*" is a last-resort wildcard (used only when no other key matches).
  #
  # Cross-validation: if a configured whitelist contains efforts the upstream model metadata does NOT declare, the out-of-range entries are dropped with a warn log. If the intersection is empty, the metadata wins (avoids guaranteed 400s from stale config).
  #
  # Runtime dynamically extends this (learned from invalid_reasoning_effort errors, persisted to negotiation-states.json). Config-sourced entries take precedence over runtime-learned, which in turn take precedence over model metadata.
  # Default: no constraints (all effort levels declared by the model pass through).
  # effort_overrides:
  #   claude-opus-4.7: [medium]
  #   claude-opus-4.7-1m-internal: [medium]

  # ---------------------------------------------------------------------------
  # anthropic-beta header pre-filter
  # ---------------------------------------------------------------------------
  # Strip the listed `anthropic-beta` tokens from outbound requests before they are forwarded upstream.
  # Keys are model-name substrings matched against the resolved model name; the pseudo-key "*" applies to every model.
  # Applies to both client-sent and locally-built betas, so use it for tokens the upstream rejects (e.g. `unsupported beta header(s): X`).
  #
  # Match semantics (strip-list — additive): every matching key contributes its tokens to the strip set, including "*". Use "*" to define a baseline and per-model keys to add to it.
  #
  # Runtime negotiation also populates a persistent cache (negotiation-states.json) when upstream returns "unsupported beta header(s)". Config entries are always applied; runtime-learned entries survive restarts.
  #
  # Default: none (no pre-filter; rely on runtime negotiation only).
  beta_strip_headers:
    claude-opus-4.7-1m-internal:
      - context-1m-2025-08-07
      - mid-conversation-system-2026-04-07

  # ---------------------------------------------------------------------------
  # Body field pre-filter
  # ---------------------------------------------------------------------------
  # Strip top-level body fields from outbound Anthropic payloads per model.
  # Keys are model-name substrings; "*" applies to every model.
  # Match semantics (strip-list — additive): every matching key contributes its fields to the strip set, including "*".
  # Always merged with the built-in default {"*": [inference_geo]} and with runtime-learned entries from upstream `<field>: Extra inputs are not permitted` 400 errors (persisted in negotiation-states.json).
  #
  # Default: none (only built-in inference_geo strip + runtime negotiation).
  # retry_reject_body_fields:
  #   "*": [some_global_field]
  #   claude-opus-4.7: [model_specific_field]

  # ---------------------------------------------------------------------------
  # tool_use input field decoding
  # ---------------------------------------------------------------------------
  # Upstream models occasionally serialize a tool_use input field that should be an array/object into a JSON string (e.g. AskUserQuestion with `questions: "[{...}]"` instead of `questions: [{...}]`).
  # These options decode such fields back to structured form on the response wire (streaming + non-streaming) before forwarding to the client.
  # History records keep the original stringified form — decode never touches sseEvents or the stored response, so the upstream anomaly stays visible in history.
  #
  # tool_decode_input_fields: per-tool list of top-level input fields to decode.
  #   Keys are tool names, matched verbatim (no normalization). Replace semantic: setting this key replaces the whole map (write {} to disable entirely).
  #   Default: { AskUserQuestion: [questions] }.
  tool_decode_input_fields:
    AskUserQuestion:
      - questions

  # tool_decode_all_input_fields: when true, attempt to decode ALL top-level string fields of every tool_use input (ignores the map above).
  #   server_tool_use is never affected. Default: false.
  tool_decode_all_input_fields: false

  # 透明恢复上游偶发把工具调用降级成纯文本（call<invoke>…）的响应，重建为标准 tool_use block。
  # 默认 false（仅在确认遭遇该上游降级时开启）。详见 docs/rfc/tool-call-text-recovery.md。
  tool_recover_call_text: false
  # tool_backfill_question: Claude Code rejects an AskUserQuestion `questions[]` item that has a `header` but no `question` field ("must have a question").
  #   Upstream models occasionally emit such items. When true, each item that is MISSING the `question` key (present-but-empty is left untouched) and whose `header` is a non-empty string gets `question = header`.
  #   Applies on the response wire only (streaming + non-streaming), after tool_decode_input_fields; history keeps the upstream-original form. Default: true.
  tool_backfill_question: true

# ============================================================================
# Responses API
# ============================================================================
# Settings for OpenAI Responses API (/v1/responses) endpoint.

openai_responses:
  # Convert `call_xxx` IDs to `fc_xxx` in input. Required when clients send conversation history with Chat Completions-format tool call IDs to the Responses API (which requires `fc_` prefix). Default: true.
  normalize_call_ids: true

  # Use upstream WebSocket transport for streaming /responses when the model supports it.
  # Connections are reused across tool-call rounds via `previous_response_id` or session header.
  # WS failures fall back to HTTP transparently; 3 consecutive fallbacks temporarily disable WS for 5 minutes (single half-open probe on expiry). Default: false.
  upstream_ws: true

  # Fix inconsistent item IDs across `output_item.added` / `output_item.done` events from Copilot's
  # upstream stream. Required by `@ai-sdk/openai` which validates ID continuity. Default: true.
  fix_stream_ids: true

  # Keep the client-side WebSocket open after `response.completed` so the client can issue
  # follow-up `response.create` frames on the same socket. When false (default), the socket
  # closes with code 1000 after each request (HTTP-like one-shot semantics).
  # Concurrent `response.create` on the same socket is rejected with an error frame.
  client_ws_keep_open: false

# ============================================================================
# Rate Limiter
# ============================================================================
# Fine-tune the adaptive rate limiter behavior. The rate limiter is enabled/disabled via --no-rate-limit CLI flag;
# these settings control its parameters when enabled.

rate_limiter:
  # Seconds to wait before retrying after rate limit error
  retry_interval: 10
  # Seconds between requests in rate-limited mode
  request_interval: 10
  # Seconds before attempting recovery from rate-limited mode
  recovery_interval: 600
  # Consecutive successes needed to exit rate-limited mode
  consecutive_successes: 5

# ============================================================================
# Tool Name Sanitization
# ============================================================================
# Sanitize tool names that violate the target model's constraints (illegal characters like dots, over-length,
# or collisions) into legal names before sending upstream, then restore the client's original names in the
# response. Deterministic and stateless (rebuilt per request). Spans Anthropic + Chat Completions + Responses
# paths. Top-level (cross-protocol), not under anthropic.*. Default: false.
sanitize_tool_names: true
