# Copilot API Configuration / Copilot API 配置
#
# 配置生效的典型优先级：
#   1. CLI 参数（如有）
#   2. 环境变量（如有）
#   3. 配置文件。路径来自
#      1. CLI --config 参数
#      2. $XDG_DATA_HOME/copilot-api/config.yaml (~/.local/share/copilot-api/config.yaml)
#   4. 发布包内置的 config.yaml
#   5. 代码内置的默认值
#
# Typical priority of effective configuration:
#   1. CLI options (if any)
#   2. Environment variables (if any)
#   3. Config file. Path comes from
#      1. CLI --config option
#      2. $XDG_DATA_HOME/copilot-api/config.yaml (~/.local/share/copilot-api/config.yaml)
#   4. Bundled config.yaml in the dist package
#   5. Hard-coded defaults in the code
#
# 本文件中的是作者调优的值，尽可能只摘取、覆盖你需要的部分到用户配置中。
# Values in this file are author-tuned; try to only copy/override what you need into your user config.
#
# 除非另有说明，所有设置均支持热重载。 / All settings are hot-reloadable unless noted otherwise.

# ============================================================================
# Structured diagnostics and terminal UI / 结构化诊断与终端界面
# ============================================================================
# terminal_level / file_level 支持热重载；只过滤 diagnostic，不过滤请求终态行。
# terminal_level / file_level are hot-reloadable and only filter diagnostics,
# never request terminal lines. Levels: silent|trace|debug|info|warn|error|fatal.
# file.* 与 tui.enabled 在启动时冻结，修改后需重启。
# file.* and tui.enabled are frozen at startup and require a restart.
logging:
  terminal_level: info
  file_level: debug
  file:
    enabled: true
    # 空字符串解析到 $APP_DIR/logs/diagnostic。/ Empty resolves to $APP_DIR/logs/diagnostic.
    directory: ""
    # 0 = 不按大小分段。/ 0 = no size-based rolling.
    max_size_mb: 10
    # 0 = 不按数量裁剪本进程分段。/ 0 = no per-process count pruning.
    max_files_per_process: 7
    # 0 = 不按年龄清理已死亡进程 artifact。/ 0 = no age-based dead-owner retention.
    retention_days: 7

tui:
  enabled: true

# ============================================================================
# Upstream (GHC API) / 上游
# ============================================================================

# 为发往 GitHub / Copilot API 的所有出站请求配置网络代理。支持 http://、https://、socks5://、socks5h://。
# Network proxy URL for all outgoing requests to GitHub / Copilot APIs. Supports http://, https://, socks5://, socks5h://.
#
# 生效的优先级：
#   1. CLI --proxy 参数
#   2. HTTP_PROXY/HTTPS_PROXY 环境变量（在 --http-proxy-from-env 开启时）
#   3. 本设置
#
# Priority of effective configuration:
#   1. CLI --proxy flag
#   2. HTTP_PROXY/HTTPS_PROXY env vars (when --http-proxy-from-env is on)
#   3. This setting
#
# 不支持热重载（需重启）。 / Not hot-reloadable (requires restart).
#
# proxy: "http://127.0.0.1:7890"
# proxy: "socks5h://127.0.0.1:1080"
# proxy: "socks5h://user:pass@proxy.example.com:1080"

# 显式指定上游 GitHub Copilot API 基础 URL。
# Explicit upstream GitHub Copilot API base URL.
#
# 生效的优先级：
#   1. CLI --ghc-api-base-url 参数
#   2. 本设置
#   3. --account-type 参数。默认 individual → https://api.githubcopilot.com
#
# Priority of effective configuration:
#   1. CLI --ghc-api-base-url flag
#   2. This setting
#   3. --account-type flag. "individual" by default → https://api.githubcopilot.com
#
# 不支持热重载（需重启）。 / Not hot-reloadable (requires restart).
#
# ghc_api_base_url: "https://api.githubcopilot.com"

# ============================================================================
# Graceful restart pidfile / 优雅重启 pidfile
# ============================================================================
# Override the pidfile path used by the bare-metal graceful-restart handover
# protocol (pid + bootTime + port liveness check). Only read by the bare-metal
# path (no supervisor detected); systemd/pm2 skip pidfile entirely. Defaults to
# ~/.local/share/copilot-api/copilot-api.pid when unset.
# 覆盖裸手动优雅重启接管协议所用的 pidfile 路径（pid + bootTime + port 活性检查）。
# 仅裸手动路径读取（无 supervisor 时）；systemd/pm2 完全跳过 pidfile 机制。
# 缺省为 ~/.local/share/copilot-api/copilot-api.pid。
# NOT hot-reloadable (requires restart). / 不支持热重载（需重启）。

# pidfile: "/run/copilot-api/copilot-api.pid"

# ============================================================================
# Model / 模型
# ============================================================================

# 后台刷新模型列表的间隔秒数（0 = 禁用）。
# Seconds between background model list refreshes (0 = disabled).
# 让长时间运行的实例无需重启即可保持 `GET /models` 缓存新鲜。
# Keeps `GET /models` cache fresh for long-running instances without requiring a restart.
model_refresh_interval: 3600

# 模型名映射：请求模型 → 目标模型。
# Model name mappings: request model → target model.
#
# 注意：这是模型名映射的唯一来源——没有任何内置默认值。
# This is the SOLE source of model-name mapping — there are no built-in defaults.
#
# 大小写不敏感。 / Keys/values are spelling-insensitive.
#
# Anthropic 模型名兼容处理："." 与 "-" 可互换。
#   例如，入站 "claude-opus-4-5" 可命中下述规则：
#     claude-opus-4.5: claude-opus-4.8
#
# Anthropic 模型名兼容处理：剥离 "[1m]" 后缀。
#   例如，入站 "opus[1m]" 可命中下述规则（按顺序尝试）：
#     opus-1m: claude-opus-4.8
#     opus: claude-opus-4.8
#
# Anthropic-compatible model name resolver: "." and "-" are interchangeable
#   For example, ingress "claude-opus-4-5" can hit the following rule:
#     claude-opus-4.5: claude-opus-4.8
#
# Anthropic-compatible model name resolver: strip "[1m]" suffix
#   For example, ingress "opus[1m]" can hit the following rules (in order):
#     opus-1m: claude-opus-4.8
#     opus: claude-opus-4.8
#
# 若目标在可用模型列表中，直接解析命中；否则，当作别名再次尝试解析；仍不可用则放弃映射、直接透传（上游随后拒绝它）。
# If a target is in the available models list, it is resolved directly; otherwise, it is treated as an alias and resolved again;
# if still unavailable, the mapping is abandoned and passed through (the upstream then rejects it).
#
model_mappings:

  # 短别名必须指定，否则会被直接透传给上游并被拒绝。
  # Short aliases must be set; an unmapped alias is sent upstream as-is and rejected.

  # 使用最新 opus / Use latest opus
  opus: claude-opus-4.8
  opus-1m: claude-opus-4.8
  claude-opus-4.1: claude-opus-4.8
  claude-opus-4.5: claude-opus-4.8
  claude-opus-4.6: claude-opus-4.8
  claude-opus-4.7: claude-opus-4.8

  # 使用最新 sonnet / Use latest sonnet
  sonnet: claude-sonnet-5
  claude-sonnet-4.5: claude-sonnet-5
  claude-sonnet-4.6: claude-sonnet-5

  # 重定向 sonnet 到最好的 opus / Redirect all sonnet requests to best opus
  # sonnet: claude-opus-4.6
  # claude-sonnet-4.5: claude-opus-4.6
  # claude-sonnet-4.6: claude-opus-4.6

  # 使用最新 haiku / Use latest haiku
  # haiku: claude-haiku-4.5

  # 升级 haiku 到 sonnet / Upgrade haiku to sonnet
  haiku: claude-sonnet-4.6
  claude-haiku-4.5: claude-sonnet-4.6

  # Anthropic 模型名兼容处理：日期后缀 / Anthropic-compatible model name resolver: date-suffix
  #
  # 自 2026/07/16 起，不再自动剥离日期后缀 "-YYYYMMDD"，必须显式配置。
  # Since 2026/07/16, date-suffix "-YYYYMMDD" is no longer internally stripped; must be explicitly set.
  #
  claude-opus-4-5-20251101: claude-opus-4.8
  claude-opus-4-1-20250805: claude-opus-4.8
  claude-haiku-4-5-20251001: claude-haiku-4.5
  claude-sonnet-4-5-20250929: claude-sonnet-5

# 禁用模型，即便 Copilot 仍在对外提供它们。只匹配上游 `model.id`。
# Disable models even if Copilot still advertises them. Match is exact against `model.id`.
#
disabled_models:
  - claude-opus-4.6
  # - claude-opus-4.7
  # - claude-opus-4.8
  # - clause-sonnet-4.6
  # - clause-sonnet-5
