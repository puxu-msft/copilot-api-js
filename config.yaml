# Copilot API Configuration
# Copy this file to ~/.local/share/copilot-api/config.yaml and customize as needed.
# All settings are hot-reloadable unless noted otherwise.

# ============================================================================
# Proxy
# ============================================================================
# Proxy URL for all outgoing requests to GitHub / Copilot APIs. Supports http://, https://, socks5://, socks5h://.
# socks5h:// routes DNS through the proxy (recommended for privacy). Auth via URL: socks5h://user:pass@host:port
# Takes precedence over HTTP_PROXY/HTTPS_PROXY env vars. CLI --proxy flag takes precedence over this setting.
# NOT hot-reloadable (requires restart).

# proxy: "http://127.0.0.1:7890"
# proxy: "socks5h://127.0.0.1:1080"
# proxy: "socks5h://user:pass@proxy.example.com:1080"

# ============================================================================
# GHC API base URL
# ============================================================================
# Explicit upstream GitHub Copilot API base URL. When set, this overrides the
# URL derived from --account-type. Useful for self-hosted GHC proxies or
# unusual deployments. Must be http:// or https://.
# CLI --ghc-api-base-url takes precedence over this setting.
# NOT hot-reloadable (requires restart).

# ghc_api_base_url: "https://api.githubcopilot.com"

# ============================================================================
# Model
# ============================================================================
# Model name overrides: request model → target model.
#
# Override values can be:
#   - Full model names: "claude-opus-4.6", "claude-sonnet-4.5"
#   - Short aliases: "opus", "sonnet", "haiku" (resolved to best available)
#
# Matching order: raw request name checked first, then resolved (normalized) name.
#
# Built-in defaults (always active unless overridden):
#   opus   → claude-opus-4.6
#   sonnet → claude-sonnet-4.6
#   haiku  → claude-haiku-4.5
#
# If the target model is not in the available models list, it is treated as an alias and resolved again.
# If still unavailable, the best model in the same family is used as fallback.

model_overrides:

  # Use latest opus
  opus: claude-opus-4.8
  claude-opus-4.5: claude-opus-4.8
  claude-opus-4.6: claude-opus-4.8
  claude-opus-4.7: claude-opus-4.8
  claude-opus-4-5: claude-opus-4.8
  claude-opus-4-6: claude-opus-4.8
  claude-opus-4-7: claude-opus-4.8

  # Use latest sonnet
  sonnet: claude-sonnet-4.6
  claude-sonnet-4.5: claude-sonnet-4.6
  claude-sonnet-4-5: claude-sonnet-4.6

  # Redirect all sonnet requests to best opus
  # sonnet: claude-opus-4.6
  # claude-sonnet-4.5: claude-opus-4.6
  # claude-sonnet-4.6: claude-opus-4.6
  # claude-sonnet-4-5: claude-opus-4.6
  # claude-sonnet-4-6: claude-opus-4.6

  # Upgrade haiku to sonnet
  # haiku: claude-haiku-4.5
  haiku: claude-sonnet-4.6
  claude-haiku-4.5: claude-sonnet-4.6

# ============================================================================
# Model Preference (per-family priority order)
# ============================================================================
# Per-family preferred-model order used when resolving short aliases
# (opus/sonnet/haiku) and family-level fallbacks. The first entry that exists
# in the live `/models` catalog wins; if none exist, the first entry is
# returned as a best-effort fallback.
#
# Semantics: per-family REPLACEMENT. Supplying `opus: [...]` replaces the
# built-in opus list entirely. Families omitted from this section keep their
# built-in defaults (shown below).
#
# Use this to pick up newly released Claude models without recompiling, or to
# demote a model that misbehaves on your account.

model_preference:
  opus:
    - claude-opus-4.8
    - claude-opus-4.7-1m-internal
    - claude-opus-4.7
    - claude-opus-4.6
    - claude-opus-4.5
  sonnet:
    - claude-sonnet-4.6
    - claude-sonnet-4.5
  haiku:
    - claude-haiku-4.5

